<svg xmlns="http://www.w3.org/2000/svg" width="640" height="434" viewBox="0 0 640 434" role="img" aria-labelledby="title desc">
<title id="title">Does every request have a match?</title><desc id="desc">Jo&#x27;s Gardening and Astronomy requests are covered, Sam&#x27;s Gardening request is covered, and Lee&#x27;s History request is missing. Dee has no requests. The every-request condition passes Jo, Sam, and Dee; requiring at least one request removes Dee.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#17384a" stroke-width="2"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><rect x="1" y="1" width="638" height="432" rx="22" fill="#fffdf7" stroke="#d9e1dc" stroke-width="2"/><text x="26" y="40" font-size="27" fill="#17384a" text-anchor="start" font-weight="700">Does every request have a match?</text><text x="68" y="88" font-size="23" fill="#17384a" text-anchor="middle" font-weight="700">Reader</text><text x="311" y="88" font-size="23" fill="#17384a" text-anchor="middle" font-weight="700">Requested topics</text><text x="557" y="88" font-size="23" fill="#17384a" text-anchor="middle" font-weight="700">Every?</text><rect x="22" y="105" width="596" height="65" rx="9" fill="#e4f2ee" stroke="none" stroke-width="0"/><text x="67" y="146" font-size="25" fill="#17384a" text-anchor="middle" font-weight="700">Jo</text><text x="183" y="131" font-size="23" fill="#17384a" text-anchor="start" font-weight="400">Gardening: covered</text><text x="183" y="159" font-size="23" fill="#17384a" text-anchor="start" font-weight="400">Astronomy: covered</text><text x="557" y="146" font-size="25" fill="#17384a" text-anchor="middle" font-weight="700">Yes</text><rect x="22" y="181" width="596" height="54" rx="9" fill="#e4f2ee" stroke="none" stroke-width="0"/><text x="67" y="222" font-size="25" fill="#17384a" text-anchor="middle" font-weight="700">Sam</text><text x="183" y="222" font-size="23" fill="#17384a" text-anchor="start" font-weight="400">Gardening: covered</text><text x="557" y="222" font-size="25" fill="#17384a" text-anchor="middle" font-weight="700">Yes</text><rect x="22" y="243" width="596" height="54" rx="9" fill="#fbe6de" stroke="none" stroke-width="0"/><text x="67" y="284" font-size="25" fill="#17384a" text-anchor="middle" font-weight="700">Lee</text><text x="183" y="284" font-size="23" fill="#17384a" text-anchor="start" font-weight="400">History: missing</text><text x="557" y="284" font-size="25" fill="#17384a" text-anchor="middle" font-weight="700">No</text><rect x="22" y="305" width="596" height="54" rx="9" fill="#e4f2ee" stroke="none" stroke-width="0"/><text x="67" y="346" font-size="25" fill="#17384a" text-anchor="middle" font-weight="700">Dee</text><text x="183" y="346" font-size="23" fill="#17384a" text-anchor="start" font-weight="400">No requests</text><text x="557" y="346" font-size="25" fill="#17384a" text-anchor="middle" font-weight="700">Yes</text><text x="320" y="393" font-size="23" fill="#17384a" text-anchor="middle" font-weight="400">Require a request too? Keep Jo and Sam.</text><text x="320" y="420" font-size="21" fill="#17384a" text-anchor="middle" font-weight="400">Dee has no request that fails.</text></g></svg>
