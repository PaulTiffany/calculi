<svg xmlns="http://www.w3.org/2000/svg" width="640" height="315" viewBox="0 0 640 315" role="img" aria-labelledby="title desc">
<title id="title">Use the recorded bit</title><desc id="desc">With bit zero the target state is left alone. With bit one the output is X of the target and a further X returns the target. This uses X squared equals the identity.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#17384a" stroke-width="2"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><rect x="1" y="1" width="638" height="313" rx="22" fill="#fffdf7" stroke="#d9e1dc" stroke-width="2"/><text x="26" y="40" font-size="27" fill="#17384a" text-anchor="start" font-weight="700">Use the recorded bit</text><text x="49" y="91" font-size="21" fill="#17384a" text-anchor="middle" font-weight="700">Bit</text><circle cx="49" cy="133" r="23" fill="#efbb4d" stroke="#17384a" stroke-width="3"/><text x="49" y="142" font-size="27" fill="#17384a" text-anchor="middle" font-weight="700">0</text><rect x="101.5" y="104" width="155" height="52" rx="14" fill="#e4f2ee" stroke="none" stroke-width="0"/><text x="179" y="139" font-size="23" fill="#17384a" text-anchor="middle" font-weight="600">target</text><path d="M268,129 L442,129" fill="none" stroke="#17384a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="355" y="113" font-size="22" fill="#17384a" text-anchor="middle" font-weight="400">leave alone</text><rect x="460.5" y="104" width="151" height="52" rx="14" fill="#e4f2ee" stroke="none" stroke-width="0"/><text x="536" y="139" font-size="23" fill="#17384a" text-anchor="middle" font-weight="600">target</text><circle cx="49" cy="231" r="23" fill="#efbb4d" stroke="#17384a" stroke-width="3"/><text x="49" y="240" font-size="27" fill="#17384a" text-anchor="middle" font-weight="700">1</text><rect x="101.5" y="202" width="155" height="52" rx="14" fill="#e4f2ee" stroke="none" stroke-width="0"/><text x="179" y="237" font-size="23" fill="#17384a" text-anchor="middle" font-weight="600">X(target)</text><path d="M268,227 L442,227" fill="none" stroke="#17384a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="355" y="211" font-size="22" fill="#17384a" text-anchor="middle" font-weight="400">apply X</text><rect x="460.5" y="202" width="151" height="52" rx="14" fill="#e4f2ee" stroke="none" stroke-width="0"/><text x="536" y="237" font-size="23" fill="#17384a" text-anchor="middle" font-weight="600">target</text><text x="320" y="293" font-size="23" fill="#17384a" text-anchor="middle" font-weight="400">X² = I: two X operations cancel.</text></g></svg>
