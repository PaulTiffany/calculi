<svg xmlns="http://www.w3.org/2000/svg" width="640" height="390" viewBox="0 0 640 390" role="img" aria-labelledby="title desc">
<title id="title">Build a rule that keeps the second</title><desc id="desc">K I receives tea and cake. Applying K to I and tea leaves I, which receives cake and returns cake.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#17384a" stroke-width="2"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><rect x="1" y="1" width="638" height="388" rx="22" fill="#fffdf7" stroke="#d9e1dc" stroke-width="2"/><text x="26" y="40" font-size="27" fill="#17384a" text-anchor="start" font-weight="700">Build a rule that keeps the second</text><rect x="35" y="73" width="270" height="60" rx="16" fill="#e4f2ee" stroke="none" stroke-width="0"/><text x="170" y="113" font-size="29" fill="#17384a" text-anchor="middle" font-weight="700">K I tea cake</text><text x="333" y="112" font-size="22" fill="#17384a" text-anchor="start" font-weight="400">Start with two inputs</text><rect x="35" y="181" width="270" height="60" rx="16" fill="#e4f2ee" stroke="none" stroke-width="0"/><text x="170" y="221" font-size="29" fill="#17384a" text-anchor="middle" font-weight="700">I cake</text><text x="333" y="220" font-size="22" fill="#17384a" text-anchor="start" font-weight="400">K keeps I; tea is dropped</text><rect x="35" y="289" width="270" height="60" rx="16" fill="#e4f2ee" stroke="none" stroke-width="0"/><text x="170" y="329" font-size="29" fill="#17384a" text-anchor="middle" font-weight="700">cake</text><text x="333" y="328" font-size="22" fill="#17384a" text-anchor="start" font-weight="400">I returns its input</text><path d="M170,141 L170,170" fill="none" stroke="#17384a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M170,249 L170,278" fill="none" stroke="#17384a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/></g></svg>
