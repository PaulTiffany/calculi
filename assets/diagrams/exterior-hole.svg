<svg xmlns="http://www.w3.org/2000/svg" width="640" height="350" viewBox="0 0 640 350" role="img" aria-labelledby="title desc">
<title id="title">Which edges form the boundary?</title><desc id="desc">Eight square tiles fill a three-by-three grid except for the missing center tile. No perimeter totals or walking directions are supplied.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#17384a" stroke-width="2"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><rect x="1" y="1" width="638" height="348" rx="22" fill="#fffdf7" stroke="#d9e1dc" stroke-width="2"/><text x="26" y="40" font-size="27" fill="#17384a" text-anchor="start" font-weight="700">Which edges form the boundary?</text><rect x="212" y="82" width="72" height="72" rx="0" fill="#e4f2ee" stroke="#819b99" stroke-width="2"/><rect x="284" y="82" width="72" height="72" rx="0" fill="#e4f2ee" stroke="#819b99" stroke-width="2"/><rect x="356" y="82" width="72" height="72" rx="0" fill="#e4f2ee" stroke="#819b99" stroke-width="2"/><rect x="212" y="154" width="72" height="72" rx="0" fill="#e4f2ee" stroke="#819b99" stroke-width="2"/><rect x="356" y="154" width="72" height="72" rx="0" fill="#e4f2ee" stroke="#819b99" stroke-width="2"/><rect x="212" y="226" width="72" height="72" rx="0" fill="#e4f2ee" stroke="#819b99" stroke-width="2"/><rect x="284" y="226" width="72" height="72" rx="0" fill="#e4f2ee" stroke="#819b99" stroke-width="2"/><rect x="356" y="226" width="72" height="72" rx="0" fill="#e4f2ee" stroke="#819b99" stroke-width="2"/><text x="320" y="198" font-size="23" fill="#17384a" text-anchor="middle" font-weight="400">gap</text><text x="320" y="328" font-size="23" fill="#17384a" text-anchor="middle" font-weight="400">Every tile side is 1 unit.</text></g></svg>
