<svg xmlns="http://www.w3.org/2000/svg" width="640" height="255" viewBox="0 0 640 255" role="img" aria-labelledby="title desc">
<title id="title">Start, rate, time</title><desc id="desc">The practice problem starts with twelve chairs and adds four chairs per minute for three minutes. The final count is left for the reader.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#17384a" stroke-width="2"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><rect x="1" y="1" width="638" height="253" rx="22" fill="#fffdf7" stroke="#d9e1dc" stroke-width="2"/><text x="26" y="40" font-size="27" fill="#17384a" text-anchor="start" font-weight="700">Start, rate, time</text><text x="109" y="96" font-size="23" fill="#17384a" text-anchor="middle" font-weight="400">Start</text><rect x="17.0" y="126" width="184" height="52" rx="14" fill="#e4f2ee" stroke="none" stroke-width="0"/><text x="109" y="161" font-size="23" fill="#17384a" text-anchor="middle" font-weight="600">12 chairs</text><text x="320" y="96" font-size="23" fill="#17384a" text-anchor="middle" font-weight="400">Each minute</text><rect x="228.0" y="126" width="184" height="52" rx="14" fill="#e4f2ee" stroke="none" stroke-width="0"/><text x="320" y="161" font-size="23" fill="#17384a" text-anchor="middle" font-weight="600">+4 chairs</text><text x="531" y="96" font-size="23" fill="#17384a" text-anchor="middle" font-weight="400">Time</text><rect x="439.0" y="126" width="184" height="52" rx="14" fill="#e4f2ee" stroke="none" stroke-width="0"/><text x="531" y="161" font-size="23" fill="#17384a" text-anchor="middle" font-weight="600">3 minutes</text><text x="320" y="224" font-size="23" fill="#17384a" text-anchor="middle" font-weight="400">How many are added? How many are there?</text></g></svg>
