<svg xmlns="http://www.w3.org/2000/svg" width="640" height="330" viewBox="0 0 640 330" role="img" aria-labelledby="title desc">
<title id="title">Can the output go back in?</title><desc id="desc">A number-to-text label maker accepts four and returns the text four. That text cannot enter its number input for the second use.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#17384a" stroke-width="2"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><rect x="1" y="1" width="638" height="328" rx="22" fill="#fffdf7" stroke="#d9e1dc" stroke-width="2"/><text x="26" y="40" font-size="27" fill="#17384a" text-anchor="start" font-weight="700">Can the output go back in?</text><rect x="44.0" y="92" width="94" height="52" rx="14" fill="#e4f2ee" stroke="none" stroke-width="0"/><text x="91" y="127" font-size="23" fill="#17384a" text-anchor="middle" font-weight="600">4</text><text x="91" y="165" font-size="22" fill="#17384a" text-anchor="middle" font-weight="400">number</text><rect x="217" y="86" width="206" height="67" rx="10" fill="#e4f2ee" stroke="#2b8187" stroke-width="3"/><text x="320" y="127" font-size="26" fill="#17384a" text-anchor="middle" font-weight="700">Make text</text><rect x="486.5" y="92" width="125" height="52" rx="14" fill="#efbb4d" stroke="none" stroke-width="0"/><text x="549" y="127" font-size="23" fill="#17384a" text-anchor="middle" font-weight="600">&quot;four&quot;</text><text x="549" y="165" font-size="22" fill="#17384a" text-anchor="middle" font-weight="400">text</text><path d="M148,118 L203,118" fill="none" stroke="#17384a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M437,118 L473,118" fill="none" stroke="#17384a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="30" y="209" width="257" height="65" rx="12" fill="#e4f2ee" stroke="none" stroke-width="0"/><rect x="353" y="209" width="257" height="65" rx="12" fill="#fae5dc" stroke="none" stroke-width="0"/><text x="159" y="236" font-size="22" fill="#17384a" text-anchor="middle" font-weight="400">Next input needs</text><text x="159" y="263" font-size="23" fill="#17384a" text-anchor="middle" font-weight="700">a number</text><text x="481" y="236" font-size="22" fill="#17384a" text-anchor="middle" font-weight="400">What we have</text><text x="481" y="263" font-size="23" fill="#17384a" text-anchor="middle" font-weight="700">is text</text><path d="M307,229 L332,254" fill="none" stroke="#b74d32" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M332,229 L307,254" fill="none" stroke="#b74d32" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g></svg>
