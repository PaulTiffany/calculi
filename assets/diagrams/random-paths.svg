<svg xmlns="http://www.w3.org/2000/svg" width="640" height="390" viewBox="0 0 640 390" role="img" aria-labelledby="title desc">
<title id="title">An average is not a path</title><desc id="desc">Two fair independent coin tosses make four equally likely paths. Their final positions are plus two, zero, zero, and minus two.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#17384a" stroke-width="2"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><rect x="1" y="1" width="638" height="388" rx="22" fill="#fffdf7" stroke="#d9e1dc" stroke-width="2"/><text x="26" y="40" font-size="27" fill="#17384a" text-anchor="start" font-weight="700">An average is not a path</text><circle cx="65" cy="215" r="29" fill="#e4f2ee" stroke="#17384a" stroke-width="3"/><text x="65" y="224" font-size="27" fill="#17384a" text-anchor="middle" font-weight="700">0</text><path d="M96,215 L268,128" fill="none" stroke="#17384a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><circle cx="298" cy="128" r="29" fill="#e4f2ee" stroke="#17384a" stroke-width="3"/><text x="298" y="137" font-size="27" fill="#17384a" text-anchor="middle" font-weight="700">+1</text><path d="M96,215 L268,295" fill="none" stroke="#17384a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><circle cx="298" cy="295" r="29" fill="#e4f2ee" stroke="#17384a" stroke-width="3"/><text x="298" y="304" font-size="27" fill="#17384a" text-anchor="middle" font-weight="700">−1</text><path d="M331,128 L522,72" fill="none" stroke="#17384a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><circle cx="555" cy="72" r="29" fill="#e4f2ee" stroke="#17384a" stroke-width="3"/><text x="555" y="81" font-size="27" fill="#17384a" text-anchor="middle" font-weight="700">+2</text><text x="425" y="91.0" font-size="22" fill="#17384a" text-anchor="middle" font-weight="400">H</text><path d="M331,128 L522,168" fill="none" stroke="#17384a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><circle cx="555" cy="168" r="29" fill="#e4f2ee" stroke="#17384a" stroke-width="3"/><text x="555" y="177" font-size="27" fill="#17384a" text-anchor="middle" font-weight="700">0</text><text x="425" y="139.0" font-size="22" fill="#17384a" text-anchor="middle" font-weight="400">T</text><path d="M331,295 L522,262" fill="none" stroke="#17384a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><circle cx="555" cy="262" r="29" fill="#e4f2ee" stroke="#17384a" stroke-width="3"/><text x="555" y="271" font-size="27" fill="#17384a" text-anchor="middle" font-weight="700">0</text><text x="425" y="269.5" font-size="22" fill="#17384a" text-anchor="middle" font-weight="400">H</text><path d="M331,295 L522,358" fill="none" stroke="#17384a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><circle cx="555" cy="358" r="29" fill="#e4f2ee" stroke="#17384a" stroke-width="3"/><text x="555" y="367" font-size="27" fill="#17384a" text-anchor="middle" font-weight="700">−2</text><text x="425" y="317.5" font-size="22" fill="#17384a" text-anchor="middle" font-weight="400">T</text><text x="177" y="153" font-size="22" fill="#17384a" text-anchor="start" font-weight="400">H</text><text x="177" y="281" font-size="22" fill="#17384a" text-anchor="start" font-weight="400">T</text><text x="49" y="80" font-size="23" fill="#17384a" text-anchor="start" font-weight="400">Start</text></g></svg>
