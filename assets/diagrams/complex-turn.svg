<svg xmlns="http://www.w3.org/2000/svg" width="640" height="390" viewBox="0 0 640 390" role="img" aria-labelledby="title desc">
<title id="title">Turn the arrow; keep the axes</title><desc id="desc">In fixed real and imaginary axes, multiplying three plus two i by i rotates the arrow counterclockwise by a quarter turn to minus two plus three i.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#17384a" stroke-width="2"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><rect x="1" y="1" width="638" height="388" rx="22" fill="#fffdf7" stroke="#d9e1dc" stroke-width="2"/><text x="26" y="40" font-size="27" fill="#17384a" text-anchor="start" font-weight="700">Turn the arrow; keep the axes</text><path d="M106,245 L543,245" fill="none" stroke="#87999f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M315,327 L315,83" fill="none" stroke="#87999f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="552" y="253" font-size="22" fill="#17384a" text-anchor="start" font-weight="400">real</text><text x="328" y="91" font-size="22" fill="#17384a" text-anchor="start" font-weight="400">imaginary</text><text x="300" y="271" font-size="22" fill="#17384a" text-anchor="middle" font-weight="400">0</text><path d="M315,245 L405,185" fill="none" stroke="#2b8187" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M315,245 L255,155" fill="none" stroke="#b74d32" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M405,185 A108.167,108.167 0 0 0 255,155" fill="none" stroke="#17384a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="7 6"/><circle cx="405" cy="185" r="4" fill="#2b8187" stroke="#2b8187" stroke-width="1"/><circle cx="255" cy="155" r="4" fill="#b74d32" stroke="#b74d32" stroke-width="1"/><text x="476" y="154" font-size="23" fill="#17384a" text-anchor="middle" font-weight="400">Before</text><text x="476" y="189" font-size="27" fill="#17384a" text-anchor="middle" font-weight="700">3 + 2i</text><text x="178" y="121" font-size="23" fill="#17384a" text-anchor="middle" font-weight="400">After</text><text x="178" y="156" font-size="27" fill="#17384a" text-anchor="middle" font-weight="700">−2 + 3i</text><text x="320" y="369" font-size="23" fill="#17384a" text-anchor="middle" font-weight="400">Multiplying by i makes a quarter-turn.</text></g></svg>
