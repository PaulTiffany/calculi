<svg xmlns="http://www.w3.org/2000/svg" width="640" height="310" viewBox="0 0 640 310" role="img" aria-labelledby="title desc">
<title id="title">Rate, change, and starting amount</title><desc id="desc">A tank starts with five liters. Two liters per minute for three minutes adds six liters, leaving eleven liters.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#17384a" stroke-width="2"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><rect x="1" y="1" width="638" height="308" rx="22" fill="#fffdf7" stroke="#d9e1dc" stroke-width="2"/><text x="26" y="40" font-size="27" fill="#17384a" text-anchor="start" font-weight="700">Rate, change, and starting amount</text><rect x="62" y="87" width="106" height="132" rx="8" fill="white" stroke="#17384a" stroke-width="3"/><rect x="67" y="164" width="96" height="50" rx="2" fill="#8bcce5" stroke="none" stroke-width="0"/><path d="M62,87 L62,219 L168,219 L168,87" fill="none" stroke="#17384a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="115" y="76" font-size="23" fill="#17384a" text-anchor="middle" font-weight="400">Start</text><text x="115" y="255" font-size="27" fill="#17384a" text-anchor="middle" font-weight="700">5 liters</text><rect x="463" y="87" width="106" height="132" rx="8" fill="white" stroke="#17384a" stroke-width="3"/><rect x="468" y="104" width="96" height="110" rx="2" fill="#8bcce5" stroke="none" stroke-width="0"/><path d="M463,87 L463,219 L569,219 L569,87" fill="none" stroke="#17384a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="516" y="76" font-size="23" fill="#17384a" text-anchor="middle" font-weight="400">Finish</text><text x="516" y="255" font-size="27" fill="#17384a" text-anchor="middle" font-weight="700">11 liters</text><path d="M192,160 L438,160" fill="none" stroke="#17384a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="240.0" y="97" width="150" height="52" rx="14" fill="#e4f2ee" stroke="none" stroke-width="0"/><text x="315" y="132" font-size="23" fill="#17384a" text-anchor="middle" font-weight="600">+6 liters</text><text x="315" y="199" font-size="23" fill="#17384a" text-anchor="middle" font-weight="400">2 liters/min</text><text x="315" y="227" font-size="23" fill="#17384a" text-anchor="middle" font-weight="400">× 3 minutes</text></g></svg>
