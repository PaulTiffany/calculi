<svg xmlns="http://www.w3.org/2000/svg" width="640" height="345" viewBox="0 0 640 345" role="img" aria-labelledby="title desc">
<title id="title">Make the idea travel</title><desc id="desc">Read an example, make a prediction, explain your reasoning, and change one thing. Repeat with the changed problem.</desc>
