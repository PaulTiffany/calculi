<svg xmlns="http://www.w3.org/2000/svg" width="640" height="457" viewBox="0 0 640 457" role="img" aria-labelledby="title desc">
<title id="title">Two preparations, one shared handoff</title><desc id="desc">Starting with neither preparation done, folding makes only Jo ready and clearing makes only Sam ready. Either preparation can happen first. After both, the handoff can occur, followed by displaying the poster.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#17384a" stroke-width="2"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><rect x="1" y="1" width="638" height="455" rx="22" fill="#fffdf7" stroke="#d9e1dc" stroke-width="2"/><text x="26" y="40" font-size="27" fill="#17384a" text-anchor="start" font-weight="700">Two preparations, one shared handoff</text><rect x="214.5" y="71" width="211" height="52" rx="14" fill="#e4f2ee" stroke="none" stroke-width="0"/><text x="320" y="106" font-size="23" fill="#17384a" text-anchor="middle" font-weight="600">Neither ready</text><rect x="48.0" y="184" width="186" height="52" rx="14" fill="#e4f2ee" stroke="none" stroke-width="0"/><text x="141" y="219" font-size="23" fill="#17384a" text-anchor="middle" font-weight="600">Jo ready</text><rect x="406.0" y="184" width="186" height="52" rx="14" fill="#e4f2ee" stroke="none" stroke-width="0"/><text x="499" y="219" font-size="23" fill="#17384a" text-anchor="middle" font-weight="600">Sam ready</text><rect x="216.5" y="297" width="207" height="52" rx="14" fill="#e4f2ee" stroke="none" stroke-width="0"/><text x="320" y="332" font-size="23" fill="#17384a" text-anchor="middle" font-weight="600">Both ready</text><path d="M251,129 L161,177" fill="none" stroke="#17384a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M389,129 L479,177" fill="none" stroke="#17384a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M161,241 L251,290" fill="none" stroke="#17384a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M479,241 L389,290" fill="none" stroke="#17384a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="161" y="142" font-size="23" fill="#17384a" text-anchor="middle" font-weight="400">fold</text><text x="479" y="142" font-size="23" fill="#17384a" text-anchor="middle" font-weight="400">clear</text><text x="145" y="282" font-size="23" fill="#17384a" text-anchor="middle" font-weight="400">clear</text><text x="495" y="282" font-size="23" fill="#17384a" text-anchor="middle" font-weight="400">fold</text><path d="M320,355 L320,380" fill="none" stroke="#17384a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="153.0" y="386" width="334" height="52" rx="14" fill="#efbb4d" stroke="none" stroke-width="0"/><text x="320" y="421" font-size="23" fill="#17384a" text-anchor="middle" font-weight="600">Handoff, then display</text></g></svg>
