<svg xmlns="http://www.w3.org/2000/svg" width="640" height="330" viewBox="0 0 640 330" role="img" aria-labelledby="title desc">
<title id="title">One action, two kinds of fact</title><desc id="desc">Opening the cupboard changes its door from closed to open. The cup remains inside in both states.</desc>
