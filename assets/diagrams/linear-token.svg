<svg xmlns="http://www.w3.org/2000/svg" width="640" height="325" viewBox="0 0 640 325" role="img" aria-labelledby="title desc">
<title id="title">One token, two possible choices</title><desc id="desc">A single token can be exchanged for one snack or for one drink. The two branches show alternatives; each purchase consumes the token.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#17384a" stroke-width="2"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><rect x="1" y="1" width="638" height="323" rx="22" fill="#fffdf7" stroke="#d9e1dc" stroke-width="2"/><text x="26" y="40" font-size="27" fill="#17384a" text-anchor="start" font-weight="700">One token, two possible choices</text><rect x="38.5" y="137" width="147" height="52" rx="14" fill="#fff1ce" stroke="none" stroke-width="0"/><text x="112" y="172" font-size="23" fill="#17384a" text-anchor="middle" font-weight="600">1 token</text><path d="M201,154 L384,109" fill="none" stroke="#17384a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M201,175 L384,226" fill="none" stroke="#17384a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="294" y="181" font-size="26" fill="#17384a" text-anchor="middle" font-weight="700">OR</text><rect x="414.0" y="81" width="172" height="52" rx="14" fill="#e4f2ee" stroke="none" stroke-width="0"/><text x="500" y="116" font-size="23" fill="#17384a" text-anchor="middle" font-weight="600">snack</text><rect x="414.0" y="200" width="172" height="52" rx="14" fill="#8bcce5" stroke="none" stroke-width="0"/><text x="500" y="235" font-size="23" fill="#17384a" text-anchor="middle" font-weight="600">drink</text><text x="320" y="297" font-size="24" fill="#17384a" text-anchor="middle" font-weight="400">Each exchange consumes the token.</text></g></svg>
