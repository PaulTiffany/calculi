<svg xmlns="http://www.w3.org/2000/svg" width="640" height="290" viewBox="0 0 640 290" role="img" aria-labelledby="title desc">
<title id="title">One stretch, two descriptions</title><desc id="desc">The same linear map doubles east-west lengths and leaves north-south lengths unchanged. In east-north coordinates the diagonal factors are two and one; in north-west coordinates they are one and two.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#17384a" stroke-width="2"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><rect x="1" y="1" width="638" height="288" rx="22" fill="#fffdf7" stroke="#d9e1dc" stroke-width="2"/><text x="26" y="40" font-size="27" fill="#17384a" text-anchor="start" font-weight="700">One stretch, two descriptions</text><rect x="24" y="77" width="282" height="155" rx="15" fill="white" stroke="#b3c8c6" stroke-width="2"/><text x="165" y="107" font-size="25" fill="#17384a" text-anchor="middle" font-weight="700">East, north</text><text x="52" y="156" font-size="25" fill="#17384a" text-anchor="start" font-weight="400">East</text><rect x="209.0" y="120" width="70" height="52" rx="14" fill="#e4f2ee" stroke="none" stroke-width="0"/><text x="244" y="155" font-size="23" fill="#17384a" text-anchor="middle" font-weight="600">×2</text><text x="52" y="211" font-size="25" fill="#17384a" text-anchor="start" font-weight="400">North</text><rect x="209.0" y="175" width="70" height="52" rx="14" fill="#fff1ce" stroke="none" stroke-width="0"/><text x="244" y="210" font-size="23" fill="#17384a" text-anchor="middle" font-weight="600">×1</text><rect x="334" y="77" width="282" height="155" rx="15" fill="white" stroke="#b3c8c6" stroke-width="2"/><text x="475" y="107" font-size="25" fill="#17384a" text-anchor="middle" font-weight="700">North, west</text><text x="362" y="156" font-size="25" fill="#17384a" text-anchor="start" font-weight="400">North</text><rect x="519.0" y="120" width="70" height="52" rx="14" fill="#fff1ce" stroke="none" stroke-width="0"/><text x="554" y="155" font-size="23" fill="#17384a" text-anchor="middle" font-weight="600">×1</text><text x="362" y="211" font-size="25" fill="#17384a" text-anchor="start" font-weight="400">West</text><rect x="519.0" y="175" width="70" height="52" rx="14" fill="#e4f2ee" stroke="none" stroke-width="0"/><text x="554" y="210" font-size="23" fill="#17384a" text-anchor="middle" font-weight="600">×2</text><text x="320" y="269" font-size="23" fill="#17384a" text-anchor="middle" font-weight="400">The east–west stretch is still twice as large.</text></g></svg>
