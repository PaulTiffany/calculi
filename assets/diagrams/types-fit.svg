<svg xmlns="http://www.w3.org/2000/svg" width="640" height="310" viewBox="0 0 640 310" role="img" aria-labelledby="title desc">
<title id="title">Check the kind of input</title><desc id="desc">An instruction from date to text can connect to one from text to printed card. A photograph does not fit an input that specifically requires text.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#17384a" stroke-width="2"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><rect x="1" y="1" width="638" height="308" rx="22" fill="#fffdf7" stroke="#d9e1dc" stroke-width="2"/><text x="26" y="40" font-size="27" fill="#17384a" text-anchor="start" font-weight="700">Check the kind of input</text><rect x="34" y="80" width="140" height="70" rx="13" fill="#e4f2ee" stroke="#2b8187" stroke-width="3"/><text x="104" y="124" font-size="26" fill="#17384a" text-anchor="middle" font-weight="700">date</text><rect x="249" y="80" width="140" height="70" rx="13" fill="#e4f2ee" stroke="#2b8187" stroke-width="3"/><text x="319" y="124" font-size="26" fill="#17384a" text-anchor="middle" font-weight="700">text</text><rect x="464" y="80" width="140" height="70" rx="13" fill="#e4f2ee" stroke="#2b8187" stroke-width="3"/><text x="534" y="124" font-size="26" fill="#17384a" text-anchor="middle" font-weight="700">card</text><path d="M182,115 L242,115" fill="none" stroke="#17384a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M397,115 L457,115" fill="none" stroke="#17384a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="32.0" y="209" width="148" height="52" rx="14" fill="#fbe6de" stroke="none" stroke-width="0"/><text x="106" y="244" font-size="23" fill="#17384a" text-anchor="middle" font-weight="600">photo</text><rect x="392.5" y="209" width="183" height="52" rx="14" fill="#e4f2ee" stroke="none" stroke-width="0"/><text x="484" y="244" font-size="23" fill="#17384a" text-anchor="middle" font-weight="600">needs text</text><path d="M194,238 L369,238" fill="none" stroke="#b74d32" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6"/><path d="M268,217 L296,259" fill="none" stroke="#b74d32" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M268,259 L296,217" fill="none" stroke="#b74d32" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g></svg>
