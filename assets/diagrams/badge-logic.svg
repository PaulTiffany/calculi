<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320" role="img" aria-labelledby="title desc">
<title id="title">A one-way rule</title><desc id="desc">All club members have badges. Jo is shown inside the members group, itself inside badge holders. A possible guest also has a badge, outside the members group.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#17384a" stroke-width="2"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><rect x="1" y="1" width="638" height="318" rx="22" fill="#fffdf7" stroke="#d9e1dc" stroke-width="2"/><text x="26" y="40" font-size="27" fill="#17384a" text-anchor="start" font-weight="700">A one-way rule</text><rect x="25" y="68" width="590" height="224" rx="20" fill="#fff1ce" stroke="#efbb4d" stroke-width="3"/><text x="47" y="102" font-size="25" fill="#17384a" text-anchor="start" font-weight="700">People with badges</text><rect x="48" y="126" width="252" height="143" rx="18" fill="#e4f2ee" stroke="#2b8187" stroke-width="3"/><text x="68" y="159" font-size="24" fill="#17384a" text-anchor="start" font-weight="700">Club members</text><circle cx="102" cy="207" r="22" fill="#2b8187" stroke="#17384a" stroke-width="3"/><circle cx="95" cy="204" r="2" fill="#17384a" stroke="none" stroke-width="0"/><circle cx="109" cy="204" r="2" fill="#17384a" stroke="none" stroke-width="0"/><path d="M96,214 Q102,220 108,214" fill="none" stroke="#17384a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="143" y="215" font-size="25" fill="#17384a" text-anchor="start" font-weight="400">Jo</text><circle cx="90" cy="230" r="7" fill="#efbb4d" stroke="#17384a" stroke-width="2"/><circle cx="447" cy="160" r="22" fill="#b74d32" stroke="#17384a" stroke-width="3"/><circle cx="440" cy="157" r="2" fill="#17384a" stroke="none" stroke-width="0"/><circle cx="454" cy="157" r="2" fill="#17384a" stroke="none" stroke-width="0"/><path d="M441,167 Q447,173 453,167" fill="none" stroke="#17384a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="436" cy="184" r="7" fill="#efbb4d" stroke="#17384a" stroke-width="2"/><text x="447" y="224" font-size="23" fill="#17384a" text-anchor="middle" font-weight="400">A guest could</text><text x="447" y="254" font-size="23" fill="#17384a" text-anchor="middle" font-weight="400">have a badge too.</text></g></svg>
