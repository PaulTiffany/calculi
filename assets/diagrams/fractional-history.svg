<svg xmlns="http://www.w3.org/2000/svg" width="640" height="390" viewBox="0 0 640 390" role="img" aria-labelledby="title desc">
<title id="title">A small weighted-history model</title><desc id="desc">Record A has changes four, zero, zero; record B has zero, four, zero. Weighting those intervals by one-quarter, one-half, and one gives scores one and two. These teaching weights do not define a fractional derivative.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#17384a" stroke-width="2"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><rect x="1" y="1" width="638" height="388" rx="22" fill="#fffdf7" stroke="#d9e1dc" stroke-width="2"/><text x="26" y="40" font-size="27" fill="#17384a" text-anchor="start" font-weight="700">A small weighted-history model</text><text x="167" y="86" font-size="23" fill="#17384a" text-anchor="middle" font-weight="700">Oldest</text><text x="167" y="120" font-size="24" fill="#17384a" text-anchor="middle" font-weight="400">× 1/4</text><text x="311" y="86" font-size="23" fill="#17384a" text-anchor="middle" font-weight="700">Middle</text><text x="311" y="120" font-size="24" fill="#17384a" text-anchor="middle" font-weight="400">× 1/2</text><text x="455" y="86" font-size="23" fill="#17384a" text-anchor="middle" font-weight="700">Newest</text><text x="455" y="120" font-size="24" fill="#17384a" text-anchor="middle" font-weight="400">× 1</text><text x="584" y="120" font-size="23" fill="#17384a" text-anchor="middle" font-weight="700">Score</text><text x="48" y="191" font-size="28" fill="#17384a" text-anchor="middle" font-weight="700">A</text><circle cx="167" cy="183" r="25" fill="#e4f2ee" stroke="#17384a" stroke-width="3"/><text x="167" y="192" font-size="27" fill="#17384a" text-anchor="middle" font-weight="700">4</text><circle cx="311" cy="183" r="25" fill="#e4f2ee" stroke="#17384a" stroke-width="3"/><text x="311" y="192" font-size="27" fill="#17384a" text-anchor="middle" font-weight="700">0</text><circle cx="455" cy="183" r="25" fill="#e4f2ee" stroke="#17384a" stroke-width="3"/><text x="455" y="192" font-size="27" fill="#17384a" text-anchor="middle" font-weight="700">0</text><path d="M497,183 L541,183" fill="none" stroke="#17384a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><circle cx="584" cy="183" r="25" fill="#efbb4d" stroke="#17384a" stroke-width="3"/><text x="584" y="192" font-size="27" fill="#17384a" text-anchor="middle" font-weight="700">1</text><text x="48" y="265" font-size="28" fill="#17384a" text-anchor="middle" font-weight="700">B</text><circle cx="167" cy="257" r="25" fill="#e4f2ee" stroke="#17384a" stroke-width="3"/><text x="167" y="266" font-size="27" fill="#17384a" text-anchor="middle" font-weight="700">0</text><circle cx="311" cy="257" r="25" fill="#e4f2ee" stroke="#17384a" stroke-width="3"/><text x="311" y="266" font-size="27" fill="#17384a" text-anchor="middle" font-weight="700">4</text><circle cx="455" cy="257" r="25" fill="#e4f2ee" stroke="#17384a" stroke-width="3"/><text x="455" y="266" font-size="27" fill="#17384a" text-anchor="middle" font-weight="700">0</text><path d="M497,257 L541,257" fill="none" stroke="#17384a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><circle cx="584" cy="257" r="25" fill="#efbb4d" stroke="#17384a" stroke-width="3"/><text x="584" y="266" font-size="27" fill="#17384a" text-anchor="middle" font-weight="700">2</text><text x="320" y="328" font-size="24" fill="#17384a" text-anchor="middle" font-weight="700">Multiply by the weights, then add.</text><text x="320" y="366" font-size="22" fill="#17384a" text-anchor="middle" font-weight="400">Toy score, not a fractional derivative.</text></g></svg>
