<svg xmlns="http://www.w3.org/2000/svg" width="640" height="350" viewBox="0 0 640 350" role="img" aria-labelledby="title desc">
<title id="title">A new obstacle changes the choices</title><desc id="desc">Without an obstacle, the straight path connects two points. With a cabinet blocking that route, an allowed path goes around it. The goal can remain shortest length.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#17384a" stroke-width="2"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><rect x="1" y="1" width="638" height="348" rx="22" fill="#fffdf7" stroke="#d9e1dc" stroke-width="2"/><text x="26" y="40" font-size="27" fill="#17384a" text-anchor="start" font-weight="700">A new obstacle changes the choices</text><text x="26" y="80" font-size="23" fill="#17384a" text-anchor="start" font-weight="700">Clear floor</text><path d="M84,112 L554,112" fill="none" stroke="#2b8187" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="84" cy="112" r="20" fill="#e4f2ee" stroke="#17384a" stroke-width="3"/><text x="84" y="121" font-size="27" fill="#17384a" text-anchor="middle" font-weight="700">A</text><circle cx="554" cy="112" r="20" fill="#e4f2ee" stroke="#17384a" stroke-width="3"/><text x="554" y="121" font-size="27" fill="#17384a" text-anchor="middle" font-weight="700">B</text><text x="26" y="190" font-size="23" fill="#17384a" text-anchor="start" font-weight="700">Cabinet in the way</text><path d="M84,263 L554,263" fill="none" stroke="#c9b5ae" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6"/><rect x="247" y="220" width="142" height="87" rx="4" fill="#f7dfb2" stroke="#17384a" stroke-width="3"/><text x="318" y="270" font-size="23" fill="#17384a" text-anchor="middle" font-weight="400">cabinet</text><path d="M84,263 L247,209 L389,209 L554,263" fill="none" stroke="#2b8187" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="84" cy="263" r="20" fill="#e4f2ee" stroke="#17384a" stroke-width="3"/><text x="84" y="272" font-size="27" fill="#17384a" text-anchor="middle" font-weight="700">A</text><circle cx="554" cy="263" r="20" fill="#e4f2ee" stroke="#17384a" stroke-width="3"/><text x="554" y="272" font-size="27" fill="#17384a" text-anchor="middle" font-weight="700">B</text></g></svg>
