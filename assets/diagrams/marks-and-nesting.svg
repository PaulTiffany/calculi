<svg xmlns="http://www.w3.org/2000/svg" width="640" height="330" viewBox="0 0 640 330" role="img" aria-labelledby="title desc">
<title id="title">Arrangement changes the rule</title><desc id="desc">In the lesson&#x27;s parentheses notation, two empty marks beside one another simplify to one mark. A mark inside a mark simplifies to the unmarked form, shown as blank space rather than zero.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#17384a" stroke-width="2"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><rect x="1" y="1" width="638" height="328" rx="22" fill="#fffdf7" stroke="#d9e1dc" stroke-width="2"/><text x="26" y="40" font-size="27" fill="#17384a" text-anchor="start" font-weight="700">Arrangement changes the rule</text><text x="32" y="94" font-size="24" fill="#17384a" text-anchor="start" font-weight="700">Beside</text><text x="210" y="113" font-size="49" fill="#17384a" text-anchor="middle" font-weight="400">() ()</text><path d="M303,94 L401,94" fill="none" stroke="#17384a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="492" y="113" font-size="49" fill="#17384a" text-anchor="middle" font-weight="400">()</text><text x="32" y="216" font-size="24" fill="#17384a" text-anchor="start" font-weight="700">Inside</text><text x="210" y="236" font-size="49" fill="#17384a" text-anchor="middle" font-weight="400">(())</text><path d="M303,216 L401,216" fill="none" stroke="#17384a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="505" y="266" font-size="22" fill="#17384a" text-anchor="middle" font-weight="400">blank space</text><text x="320" y="307" font-size="21" fill="#17384a" text-anchor="middle" font-weight="400">The parentheses are this lesson’s stand-in marks.</text></g></svg>
