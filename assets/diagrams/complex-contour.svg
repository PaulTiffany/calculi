<svg xmlns="http://www.w3.org/2000/svg" width="640" height="340" viewBox="0 0 640 340" role="img" aria-labelledby="title desc">
<title id="title">Go around a point without touching it</title><desc id="desc">A counterclockwise circular contour surrounds zero. The example function one divided by z is undefined at zero, but the circle itself avoids zero.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#17384a" stroke-width="2"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><rect x="1" y="1" width="638" height="338" rx="22" fill="#fffdf7" stroke="#d9e1dc" stroke-width="2"/><text x="26" y="40" font-size="27" fill="#17384a" text-anchor="start" font-weight="700">Go around a point without touching it</text><circle cx="178" cy="189" r="86" fill="white" stroke="#2b8187" stroke-width="4"/><path d="M264,189 A86,86 0 0 0 178,103" fill="none" stroke="#2b8187" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><circle cx="178" cy="189" r="7" fill="#b74d32" stroke="#17384a" stroke-width="2"/><text x="178" y="226" font-size="25" fill="#17384a" text-anchor="middle" font-weight="400">0</text><text x="438" y="120" font-size="26" fill="#17384a" text-anchor="middle" font-weight="700">Example: 1 / z</text><text x="438" y="178" font-size="24" fill="#17384a" text-anchor="middle" font-weight="400">Undefined at 0</text><text x="438" y="230" font-size="24" fill="#17384a" text-anchor="middle" font-weight="400">Path avoids 0</text><text x="320" y="316" font-size="23" fill="#17384a" text-anchor="middle" font-weight="400">The path still surrounds the excluded point.</text></g></svg>
