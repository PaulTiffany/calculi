<svg xmlns="http://www.w3.org/2000/svg" width="640" height="285" viewBox="0 0 640 285" role="img" aria-labelledby="title desc">
<title id="title">Allocate a resource to each task</title><desc id="desc">One of two separate tokens is exchanged for a snack and the other for a drink. Each token supports just one of the two purchases.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#17384a" stroke-width="2"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><rect x="1" y="1" width="638" height="283" rx="22" fill="#fffdf7" stroke="#d9e1dc" stroke-width="2"/><text x="26" y="40" font-size="27" fill="#17384a" text-anchor="start" font-weight="700">Allocate a resource to each task</text><rect x="35.5" y="83" width="159" height="52" rx="14" fill="#fff1ce" stroke="none" stroke-width="0"/><text x="115" y="118" font-size="23" fill="#17384a" text-anchor="middle" font-weight="600">token 1</text><path d="M214,107 L402,107" fill="none" stroke="#17384a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="431.5" y="83" width="173" height="52" rx="14" fill="#e4f2ee" stroke="none" stroke-width="0"/><text x="518" y="118" font-size="23" fill="#17384a" text-anchor="middle" font-weight="600">snack</text><rect x="35.5" y="178" width="159" height="52" rx="14" fill="#fff1ce" stroke="none" stroke-width="0"/><text x="115" y="213" font-size="23" fill="#17384a" text-anchor="middle" font-weight="600">token 2</text><path d="M214,202 L402,202" fill="none" stroke="#17384a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="431.5" y="178" width="173" height="52" rx="14" fill="#8bcce5" stroke="none" stroke-width="0"/><text x="518" y="213" font-size="23" fill="#17384a" text-anchor="middle" font-weight="600">drink</text></g></svg>
