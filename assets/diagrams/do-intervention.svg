<svg xmlns="http://www.w3.org/2000/svg" width="640" height="390" viewBox="0 0 640 390" role="img" aria-labelledby="title desc">
<title id="title">Set watering; keep its effects</title><desc id="desc">The observational graph has weather affecting watering and growth, and watering affecting growth. Setting watering removes the incoming weather-to-watering arrow while retaining the other arrows. The crossed dashed line marks the removed arrow.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#17384a" stroke-width="2"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><rect x="1" y="1" width="638" height="388" rx="22" fill="#fffdf7" stroke="#d9e1dc" stroke-width="2"/><text x="26" y="40" font-size="27" fill="#17384a" text-anchor="start" font-weight="700">Set watering; keep its effects</text><path d="M320,62 L320,335" fill="none" stroke="#ccd8d4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="162" y="90" font-size="24" fill="#17384a" text-anchor="middle" font-weight="700">Observed choices</text><rect x="91.0" y="114" width="142" height="52" rx="14" fill="#e4f2ee" stroke="none" stroke-width="0"/><text x="162" y="149" font-size="23" fill="#17384a" text-anchor="middle" font-weight="600">Weather</text><rect x="12.0" y="253" width="116" height="52" rx="14" fill="#e4f2ee" stroke="none" stroke-width="0"/><text x="70" y="288" font-size="23" fill="#17384a" text-anchor="middle" font-weight="600">Watering</text><rect x="196.0" y="253" width="112" height="52" rx="14" fill="#e4f2ee" stroke="none" stroke-width="0"/><text x="252" y="288" font-size="23" fill="#17384a" text-anchor="middle" font-weight="600">Growth</text><path d="M186,171 L241,248" fill="none" stroke="#17384a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M134,278 L188,278" fill="none" stroke="#17384a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M138,171 L78,248" fill="none" stroke="#17384a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="482" y="90" font-size="24" fill="#17384a" text-anchor="middle" font-weight="700">do(watering)</text><rect x="411.0" y="114" width="142" height="52" rx="14" fill="#e4f2ee" stroke="none" stroke-width="0"/><text x="482" y="149" font-size="23" fill="#17384a" text-anchor="middle" font-weight="600">Weather</text><rect x="332.0" y="253" width="116" height="52" rx="14" fill="#e4f2ee" stroke="none" stroke-width="0"/><text x="390" y="288" font-size="23" fill="#17384a" text-anchor="middle" font-weight="600">Watering</text><rect x="516.0" y="253" width="112" height="52" rx="14" fill="#e4f2ee" stroke="none" stroke-width="0"/><text x="572" y="288" font-size="23" fill="#17384a" text-anchor="middle" font-weight="600">Growth</text><path d="M506,171 L561,248" fill="none" stroke="#17384a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M454,278 L508,278" fill="none" stroke="#17384a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M458,171 L398,248" fill="none" stroke="#a8babc" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6"/><path d="M418,196 L440,218" fill="none" stroke="#b74d32" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M440,196 L418,218" fill="none" stroke="#b74d32" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="320" y="358" font-size="22" fill="#17384a" text-anchor="middle" font-weight="400">Incoming cause removed; outgoing cause kept.</text></g></svg>
