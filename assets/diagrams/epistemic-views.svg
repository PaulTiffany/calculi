<svg xmlns="http://www.w3.org/2000/svg" width="640" height="355" viewBox="0 0 640 355" role="img" aria-labelledby="title desc">
<title id="title">One card, two views</title><desc id="desc">The chosen card A is a red circle. Jo sees only color, leaving A or B possible. Sam sees only shape, leaving A or C possible.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#17384a" stroke-width="2"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><rect x="1" y="1" width="638" height="353" rx="22" fill="#fffdf7" stroke="#d9e1dc" stroke-width="2"/><text x="26" y="40" font-size="27" fill="#17384a" text-anchor="start" font-weight="700">One card, two views</text><rect x="19" y="75" width="122" height="127" rx="12" fill="white" stroke="#17384a" stroke-width="4"/><text x="80" y="105" font-size="26" fill="#17384a" text-anchor="middle" font-weight="700">A</text><circle cx="80" cy="139" r="16" fill="#b74d32" stroke="#17384a" stroke-width="2"/><text x="80" y="183" font-size="22" fill="#17384a" text-anchor="middle" font-weight="400">red</text><rect x="179" y="75" width="122" height="127" rx="12" fill="white" stroke="#a8babc" stroke-width="2"/><text x="240" y="105" font-size="26" fill="#17384a" text-anchor="middle" font-weight="700">B</text><path d="M240,122 L222,154 L258,154 Z" fill="#b74d32" stroke="#17384a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="240" y="183" font-size="22" fill="#17384a" text-anchor="middle" font-weight="400">red</text><rect x="339" y="75" width="122" height="127" rx="12" fill="white" stroke="#a8babc" stroke-width="2"/><text x="400" y="105" font-size="26" fill="#17384a" text-anchor="middle" font-weight="700">C</text><circle cx="400" cy="139" r="16" fill="#8bcce5" stroke="#17384a" stroke-width="2"/><text x="400" y="183" font-size="22" fill="#17384a" text-anchor="middle" font-weight="400">blue</text><rect x="499" y="75" width="122" height="127" rx="12" fill="white" stroke="#a8babc" stroke-width="2"/><text x="560" y="105" font-size="26" fill="#17384a" text-anchor="middle" font-weight="700">D</text><path d="M560,122 L542,154 L578,154 Z" fill="#8bcce5" stroke="#17384a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="560" y="183" font-size="22" fill="#17384a" text-anchor="middle" font-weight="400">blue</text><text x="320" y="235" font-size="24" fill="#17384a" text-anchor="middle" font-weight="700">Chosen card: A</text><text x="320" y="283" font-size="25" fill="#17384a" text-anchor="middle" font-weight="400">Jo sees red: A or B</text><text x="320" y="326" font-size="25" fill="#17384a" text-anchor="middle" font-weight="400">Sam sees circle: A or C</text></g></svg>
