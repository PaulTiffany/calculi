<svg xmlns="http://www.w3.org/2000/svg" width="640" height="275" viewBox="0 0 640 275" role="img" aria-labelledby="title desc">
<title id="title">Four sides; different shapes</title><desc id="desc">A square and a nonsquare rectangle both have four sides. The rectangle is a counterexample to reversing the rule that every square has four sides.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#17384a" stroke-width="2"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><rect x="1" y="1" width="638" height="273" rx="22" fill="#fffdf7" stroke="#d9e1dc" stroke-width="2"/><text x="26" y="40" font-size="27" fill="#17384a" text-anchor="start" font-weight="700">Four sides; different shapes</text><rect x="93" y="96" width="104" height="104" rx="0" fill="#e4f2ee" stroke="#2b8187" stroke-width="4"/><rect x="396" y="107" width="165" height="82" rx="0" fill="#fff1ce" stroke="#17384a" stroke-width="4"/><text x="145" y="242" font-size="25" fill="#17384a" text-anchor="middle" font-weight="400">square</text><text x="477" y="242" font-size="25" fill="#17384a" text-anchor="middle" font-weight="400">not a square</text></g></svg>
