<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
<title id="title">Definite, possible, and unresolved</title><desc id="desc">The upper approximation contains crates 1, 2, 3, and 4. Inside it, the lower approximation contains 1 and 2 and the unresolved boundary contains 3 and 4. Crates 5 and 6 are outside the upper approximation.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#17384a" stroke-width="2"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><rect x="1" y="1" width="638" height="358" rx="22" fill="#fffdf7" stroke="#d9e1dc" stroke-width="2"/><text x="26" y="40" font-size="27" fill="#17384a" text-anchor="start" font-weight="700">Definite, possible, and unresolved</text><rect x="24" y="74" width="415" height="229" rx="16" fill="#fff1ce" stroke="#17384a" stroke-width="2"/><text x="232" y="107" font-size="23" fill="#17384a" text-anchor="middle" font-weight="700">Upper: possibly ready</text><rect x="43" y="127" width="179" height="155" rx="12" fill="#e4f2ee" stroke="#2b8187" stroke-width="2"/><text x="132" y="162" font-size="24" fill="#17384a" text-anchor="middle" font-weight="700">Lower</text><text x="132" y="190" font-size="21" fill="#17384a" text-anchor="middle" font-weight="400">definitely ready</text><text x="330" y="162" font-size="24" fill="#17384a" text-anchor="middle" font-weight="700">Boundary</text><text x="330" y="190" font-size="21" fill="#17384a" text-anchor="middle" font-weight="400">unresolved</text><circle cx="89" cy="239" r="24" fill="#e4f2ee" stroke="#17384a" stroke-width="3"/><text x="89" y="248" font-size="27" fill="#17384a" text-anchor="middle" font-weight="700">1</text><circle cx="176" cy="239" r="24" fill="#e4f2ee" stroke="#17384a" stroke-width="3"/><text x="176" y="248" font-size="27" fill="#17384a" text-anchor="middle" font-weight="700">2</text><circle cx="287" cy="239" r="24" fill="#efbb4d" stroke="#17384a" stroke-width="3"/><text x="287" y="248" font-size="27" fill="#17384a" text-anchor="middle" font-weight="700">3</text><circle cx="374" cy="239" r="24" fill="#efbb4d" stroke="#17384a" stroke-width="3"/><text x="374" y="248" font-size="27" fill="#17384a" text-anchor="middle" font-weight="700">4</text><circle cx="495" cy="239" r="24" fill="#f5ddd5" stroke="#17384a" stroke-width="3"/><text x="495" y="248" font-size="27" fill="#17384a" text-anchor="middle" font-weight="700">5</text><circle cx="579" cy="239" r="24" fill="#f5ddd5" stroke="#17384a" stroke-width="3"/><text x="579" y="248" font-size="27" fill="#17384a" text-anchor="middle" font-weight="700">6</text><text x="535" y="156" font-size="23" fill="#17384a" text-anchor="middle" font-weight="700">Outside</text><text x="535" y="185" font-size="21" fill="#17384a" text-anchor="middle" font-weight="400">the upper set</text><text x="320" y="337" font-size="23" fill="#17384a" text-anchor="middle" font-weight="400">The boundary is part of the upper set.</text></g></svg>
