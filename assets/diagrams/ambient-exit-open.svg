<svg xmlns="http://www.w3.org/2000/svg" width="640" height="570" viewBox="0 0 640 570" role="img" aria-labelledby="title desc">
<title id="title">Leave the van, or remove the bag?</title><desc id="desc">Starting from parcel inside bag inside van, exiting moves the intact bag beside the van. Opening bag instead removes its boundary, leaving parcel directly inside van. The two outcomes preserve the parcel but change different boundaries.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#17384a" stroke-width="2"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><rect x="1" y="1" width="638" height="568" rx="22" fill="#fffdf7" stroke="#d9e1dc" stroke-width="2"/><text x="26" y="40" font-size="27" fill="#17384a" text-anchor="start" font-weight="700">Leave the van, or remove the bag?</text><rect x="170" y="75" width="300" height="178" rx="12" fill="white" stroke="#17384a" stroke-width="3"/><text x="320" y="108" font-size="25" fill="#17384a" text-anchor="middle" font-weight="700">van</text><rect x="197" y="126" width="246" height="109" rx="10" fill="#e4f2ee" stroke="#2b8187" stroke-width="3"/><text x="320" y="158" font-size="25" fill="#17384a" text-anchor="middle" font-weight="700">bag</text><rect x="244" y="172" width="152" height="46" rx="8" fill="#efbb4d" stroke="#17384a" stroke-width="2"/><text x="320" y="203" font-size="23" fill="#17384a" text-anchor="middle" font-weight="400">parcel</text><path d="M241,266 L157,331" fill="none" stroke="#17384a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M399,266 L483,331" fill="none" stroke="#17384a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="95" y="292" font-size="24" fill="#17384a" text-anchor="middle" font-weight="700">out van</text><text x="531" y="292" font-size="24" fill="#17384a" text-anchor="middle" font-weight="700">open bag</text><rect x="27" y="397" width="112" height="115" rx="12" fill="white" stroke="#17384a" stroke-width="3"/><text x="83" y="434" font-size="25" fill="#17384a" text-anchor="middle" font-weight="700">van</text><rect x="169" y="355" width="138" height="157" rx="10" fill="#e4f2ee" stroke="#2b8187" stroke-width="3"/><text x="238" y="393" font-size="25" fill="#17384a" text-anchor="middle" font-weight="700">bag</text><rect x="182" y="442" width="112" height="50" rx="8" fill="#efbb4d" stroke="#17384a" stroke-width="2"/><text x="238" y="475" font-size="23" fill="#17384a" text-anchor="middle" font-weight="400">parcel</text><rect x="353" y="355" width="259" height="157" rx="12" fill="white" stroke="#17384a" stroke-width="3"/><text x="483" y="393" font-size="25" fill="#17384a" text-anchor="middle" font-weight="700">van</text><rect x="403" y="442" width="159" height="50" rx="8" fill="#efbb4d" stroke="#17384a" stroke-width="2"/><text x="483" y="475" font-size="23" fill="#17384a" text-anchor="middle" font-weight="400">parcel</text><text x="164" y="548" font-size="23" fill="#17384a" text-anchor="middle" font-weight="600">Bag stays intact</text><text x="483" y="548" font-size="23" fill="#17384a" text-anchor="middle" font-weight="600">Bag boundary gone</text></g></svg>
