middle" font-weight="400">stop</text><circle cx="230" cy="435" r="27" fill="white" stroke="#17384a" stroke-width="2"/><text x="230" y="443" font-size="19" fill="#17384a" text-anchor="middle" font-weight="400">stop</text><circle cx="409" cy="435" r="27" fill="white" stroke="#17384a" stroke-width="2"/><text x="409" y="443" font-size="19" fill="#17384a" text-anchor="middle" font-weight="400">stop</text><circle cx="563" cy="435" r="27" fill="white" stroke="#17384a" stroke-width="2"/><text x="563" y="443" font-size="19" fill="#17384a" text-anchor="middle" font-weight="400">stop</text><path d="M463,162 L415,227" fill="none" stroke="#17384a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="410" y="198" font-size="23" fill="#17384a" text-anchor="middle" font-weight="400">pay</text><path d="M513,162 L558,227" fill="none" stroke="#17384a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="561" y="198" font-size="23" fill="#17384a" text-anchor="middle" font-weight="400">pay</text><rect x="345.0" y="232" width="128" height="52" rx="14" fill="#e4f2ee" stroke="none" stroke-width="0"/><text x="409" y="267" font-size="23" fill="#17384a" text-anchor="middle" font-weight="600">Tea only</text><rect x="492.5" y="232" width="141" height="52" rx="14" fill="#e4f2ee" stroke="none" stroke-width="0"/><text x="563" y="267" font-size="23" fill="#17384a" text-anchor="middle" font-weight="600">Coffee only</text><path d="M409,290 L409,405" fill="none" stroke="#17384a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="375" y="356" font-size="23" fill="#17384a" text-anchor="middle" font-weight="400">tea</text><path d="M563,290 L563,405" fill="none" stroke="#17384a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="606" y="356" font-size="20" fill="#17384a" text-anchor="middle" font-weight="400">coffee</tex