<svg xmlns="http://www.w3.org/2000/svg" width="640" height="575" viewBox="0 0 640 575" role="img" aria-labelledby="title desc">
<title id="title">Same sequences, different choices</title><desc id="desc">Machine A accepts payment then offers both tea and coffee. Machine B has two payment transitions, one to tea-only and one to coffee-only. Both allow pay-tea and pay-coffee traces, but B can commit to one drink during payment.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#17384a" stroke-width="2"/></marker></defs>
