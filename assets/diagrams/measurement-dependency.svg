<svg xmlns="http://www.w3.org/2000/svg" width="640" height="410" viewBox="0 0 640 410" role="img" aria-labelledby="title desc">
<title id="title">A measurement guides a later action</title><desc id="desc">Qubit 1 carries the input and qubit 2 is prepared. After linking them, qubit 1 is measured. Its ordinary outcome bit controls a correction on qubit 2, which is the output. The dashed path carries the recorded bit.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#17384a" stroke-width="2"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><rect x="1" y="1" width="638" height="408" rx="22" fill="#fffdf7" stroke="#d9e1dc" stroke-width="2"/><text x="26" y="40" font-size="27" fill="#17384a" text-anchor="start" font-weight="700">A measurement guides a later action</text><text x="78" y="102" font-size="23" fill="#17384a" text-anchor="middle" font-weight="700">Qubit 1</text><text x="78" y="137" font-size="22" fill="#17384a" text-anchor="middle" font-weight="400">input</text><text x="78" y="255" font-size="23" fill="#17384a" text-anchor="middle" font-weight="700">Qubit 2</text><text x="78" y="290" font-size="22" fill="#17384a" text-anchor="middle" font-weight="400">prepare</text><path d="M138,130 L331,130" fill="none" stroke="#17384a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M138,283 L464,283" fill="none" stroke="#17384a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M224,130 L224,283" fill="none" stroke="#17384a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="224" cy="130" r="7" fill="#2b8187" stroke="#17384a" stroke-width="2"/><circle cx="224" cy="283" r="7" fill="#2b8187" stroke="#17384a" stroke-width="2"/><text x="224" y="91" font-size="23" fill="#17384a" text-anchor="middle" font-weight="700">Link</text><rect x="335" y="101" width="126" height="58" rx="12" fill="#e4f2ee" stroke="#17384a" stroke-width="2"/><text x="398" y="138" font-size="23" fill="#17384a" text-anchor="middle" font-weight="400">Measure</text><path d="M462,130 H547 V249" fill="none" stroke="#2b8187" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="7 6"/><text x="490" y="196" font-size="21" fill="#17384a" text-anchor="middle" font-weight="400">record bit</text><rect x="468" y="252" width="142" height="62" rx="12" fill="#fff1ce" stroke="#17384a" stroke-width="2"/><text x="539" y="291" font-size="24" fill="#17384a" text-anchor="middle" font-weight="400">Correct</text><text x="539" y="347" font-size="22" fill="#17384a" text-anchor="middle" font-weight="400">output qubit 2</text><text x="320" y="387" font-size="22" fill="#17384a" text-anchor="middle" font-weight="400">Dashed path: an ordinary recorded bit.</text></g></svg>
