<svg xmlns="http://www.w3.org/2000/svg" width="640" height="280" viewBox="0 0 640 280" role="img" aria-labelledby="title desc">
<title id="title">Change one dimension</title><desc id="desc">A rectangular photograph is three units wide and five units tall. The reader can increase either dimension by one.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#17384a" stroke-width="2"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><rect x="1" y="1" width="638" height="278" rx="22" fill="#fffdf7" stroke="#d9e1dc" stroke-width="2"/><text x="26" y="40" font-size="27" fill="#17384a" text-anchor="start" font-weight="700">Change one dimension</text><rect x="228" y="79" width="90" height="150" rx="0" fill="#e4f2ee" stroke="#17384a" stroke-width="3"/><path d="M239,211 L262,166 L280,192 L297,176 L310,211 Z" fill="#9ec4ad" stroke="#2b8187" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="294" cy="110" r="13" fill="#efbb4d" stroke="#17384a" stroke-width="2"/><text x="272" y="263" font-size="24" fill="#17384a" text-anchor="middle" font-weight="400">width: 3</text><text x="356" y="163" font-size="24" fill="#17384a" text-anchor="start" font-weight="400">height: 5</text><text x="31" y="134" font-size="24" fill="#17384a" text-anchor="start" font-weight="400">Which</text><text x="31" y="166" font-size="24" fill="#17384a" text-anchor="start" font-weight="400">input</text><text x="31" y="198" font-size="24" fill="#17384a" text-anchor="start" font-weight="400">changes?</text></g></svg>
