<svg xmlns="http://www.w3.org/2000/svg" width="640" height="260" viewBox="0 0 640 260" role="img" aria-labelledby="title desc">
<title id="title">Pick one token</title><desc id="desc">One green and three yellow tokens are equally likely to be picked. The image supplies the starting contents only.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#17384a" stroke-width="2"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><rect x="1" y="1" width="638" height="258" rx="22" fill="#fffdf7" stroke="#d9e1dc" stroke-width="2"/><text x="26" y="40" font-size="27" fill="#17384a" text-anchor="start" font-weight="700">Pick one token</text><rect x="45" y="70" width="550" height="134" rx="40" fill="white" stroke="#17384a" stroke-width="3"/><circle cx="105.0" cy="137" r="28" fill="#2b8187" stroke="#17384a" stroke-width="3"/><text x="105.0" y="146" font-size="27" fill="#fffdf7" text-anchor="middle" font-weight="700">G</text><circle cx="248.33333333333334" cy="137" r="28" fill="#efbb4d" stroke="#17384a" stroke-width="3"/><text x="248.33333333333334" y="146" font-size="27" fill="#17384a" text-anchor="middle" font-weight="700">Y</text><circle cx="391.6666666666667" cy="137" r="28" fill="#efbb4d" stroke="#17384a" stroke-width="3"/><text x="391.6666666666667" y="146" font-size="27" fill="#17384a" text-anchor="middle" font-weight="700">Y</text><circle cx="535.0" cy="137" r="28" fill="#efbb4d" stroke="#17384a" stroke-width="3"/><text x="535.0" y="146" font-size="27" fill="#17384a" text-anchor="middle" font-weight="700">Y</text><text x="320" y="238" font-size="25" fill="#17384a" text-anchor="middle" font-weight="700">Starting contents</text></g></svg>
