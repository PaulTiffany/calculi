<svg xmlns="http://www.w3.org/2000/svg" width="640" height="370" viewBox="0 0 640 370" role="img" aria-labelledby="title desc">
<title id="title">Different names, one shared cell</title><desc id="desc">Both p and q point to the same address twelve, initially holding four. Writing nine through p changes that one cell, so reading through q now also gives nine.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#17384a" stroke-width="2"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><rect x="1" y="1" width="638" height="368" rx="22" fill="#fffdf7" stroke="#d9e1dc" stroke-width="2"/><text x="26" y="40" font-size="27" fill="#17384a" text-anchor="start" font-weight="700">Different names, one shared cell</text><path d="M320,65 L320,326" fill="none" stroke="#ccd8d4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="160" y="87" font-size="24" fill="#17384a" text-anchor="middle" font-weight="700">Before</text><rect x="31.0" y="124" width="50" height="52" rx="14" fill="#e4f2ee" stroke="none" stroke-width="0"/><text x="56" y="159" font-size="23" fill="#17384a" text-anchor="middle" font-weight="600">p</text><rect x="31.0" y="251" width="50" height="52" rx="14" fill="#e4f2ee" stroke="none" stroke-width="0"/><text x="56" y="286" font-size="23" fill="#17384a" text-anchor="middle" font-weight="600">q</text><path d="M92,150 L135,190" fill="none" stroke="#17384a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M92,277 L135,233" fill="none" stroke="#17384a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="145" y="170" width="132" height="89" rx="10" fill="#e4f2ee" stroke="#17384a" stroke-width="3"/><text x="211" y="207" font-size="30" fill="#17384a" text-anchor="middle" font-weight="700">4</text><text x="211" y="243" font-size="20" fill="#17384a" text-anchor="middle" font-weight="400">address 12</text><text x="480" y="87" font-size="24" fill="#17384a" text-anchor="middle" font-weight="700">After writing 9</text><rect x="351.0" y="124" width="50" height="52" rx="14" fill="#e4f2ee" stroke="none" stroke-width="0"/><text x="376" y="159" font-size="23" fill="#17384a" text-anchor="middle" font-weight="600">p</text><rect x="351.0" y="251" width="50" height="52" rx="14" fill="#e4f2ee" stroke="none" stroke-width="0"/><text x="376" y="286" font-size="23" fill="#17384a" text-anchor="middle" font-weight="600">q</text><path d="M412,150 L455,190" fill="none" stroke="#17384a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M412,277 L455,233" fill="none" stroke="#17384a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="465" y="170" width="132" height="89" rx="10" fill="#efbb4d" stroke="#17384a" stroke-width="3"/><text x="531" y="207" font-size="30" fill="#17384a" text-anchor="middle" font-weight="700">9</text><text x="531" y="243" font-size="20" fill="#17384a" text-anchor="middle" font-weight="400">address 12</text><text x="320" y="344" font-size="23" fill="#17384a" text-anchor="middle" font-weight="400">Reading through either name finds this value.</text></g></svg>
