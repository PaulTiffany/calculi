<svg xmlns="http://www.w3.org/2000/svg" width="640" height="350" viewBox="0 0 640 350" role="img" aria-labelledby="title desc">
<title id="title">Try the credit program</title><desc id="desc">A starting balance of five credits doubles to ten, then loses three to finish at seven. Four doubles to eight, then finishes at five and misses the goal of at least seven.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#17384a" stroke-width="2"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><rect x="1" y="1" width="638" height="348" rx="22" fill="#fffdf7" stroke="#d9e1dc" stroke-width="2"/><text x="26" y="40" font-size="27" fill="#17384a" text-anchor="start" font-weight="700">Try the credit program</text><text x="85" y="90" font-size="23" fill="#17384a" text-anchor="middle" font-weight="700">Start</text><text x="255" y="90" font-size="23" fill="#17384a" text-anchor="middle" font-weight="700">Double</text><text x="425" y="90" font-size="23" fill="#17384a" text-anchor="middle" font-weight="700">Deduct 3</text><circle cx="85" cy="149" r="29" fill="#e4f2ee" stroke="#17384a" stroke-width="3"/><text x="85" y="158" font-size="27" fill="#17384a" text-anchor="middle" font-weight="700">5</text><circle cx="255" cy="149" r="29" fill="#e4f2ee" stroke="#17384a" stroke-width="3"/><text x="255" y="158" font-size="27" fill="#17384a" text-anchor="middle" font-weight="700">10</text><circle cx="425" cy="149" r="29" fill="#e4f2ee" stroke="#17384a" stroke-width="3"/><text x="425" y="158" font-size="27" fill="#17384a" text-anchor="middle" font-weight="700">7</text><path d="M125,149 L209,149" fill="none" stroke="#17384a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M295,149 L379,149" fill="none" stroke="#17384a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="549" y="157" font-size="21" fill="#17384a" text-anchor="middle" font-weight="700">Meets goal</text><circle cx="85" cy="268" r="29" fill="#fae5dc" stroke="#17384a" stroke-width="3"/><text x="85" y="277" font-size="27" fill="#17384a" text-anchor="middle" font-weight="700">4</text><circle cx="255" cy="268" r="29" fill="#fae5dc" stroke="#17384a" stroke-width="3"/><text x="255" y="277" font-size="27" fill="#17384a" text-anchor="middle" font-weight="700">8</text><circle cx="425" cy="268" r="29" fill="#fae5dc" stroke="#17384a" stroke-width="3"/><text x="425" y="277" font-size="27" fill="#17384a" text-anchor="middle" font-weight="700">5</text><path d="M125,268 L209,268" fill="none" stroke="#17384a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M295,268 L379,268" fill="none" stroke="#17384a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="549" y="276" font-size="21" fill="#17384a" text-anchor="middle" font-weight="700">Misses goal</text><text x="320" y="328" font-size="23" fill="#17384a" text-anchor="middle" font-weight="400">Goal: at least 7 credits at the end</text></g></svg>
