<svg xmlns="http://www.w3.org/2000/svg" width="640" height="240" viewBox="0 0 640 240" role="img" aria-labelledby="title desc">
<title id="title">A sequence of headcounts</title><desc id="desc">Four room headcounts are ten, fourteen, thirteen, and eighteen, in that order.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#17384a" stroke-width="2"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><rect x="1" y="1" width="638" height="238" rx="22" fill="#fffdf7" stroke="#d9e1dc" stroke-width="2"/><text x="26" y="40" font-size="27" fill="#17384a" text-anchor="start" font-weight="700">A sequence of headcounts</text><circle cx="79" cy="135" r="34" fill="#e4f2ee" stroke="#17384a" stroke-width="3"/><text x="79" y="144" font-size="27" fill="#17384a" text-anchor="middle" font-weight="700">10</text><text x="79" y="204" font-size="21" fill="#17384a" text-anchor="middle" font-weight="400">check 1</text><circle cx="239" cy="135" r="34" fill="#e4f2ee" stroke="#17384a" stroke-width="3"/><text x="239" y="144" font-size="27" fill="#17384a" text-anchor="middle" font-weight="700">14</text><text x="239" y="204" font-size="21" fill="#17384a" text-anchor="middle" font-weight="400">check 2</text><circle cx="399" cy="135" r="34" fill="#e4f2ee" stroke="#17384a" stroke-width="3"/><text x="399" y="144" font-size="27" fill="#17384a" text-anchor="middle" font-weight="700">13</text><text x="399" y="204" font-size="21" fill="#17384a" text-anchor="middle" font-weight="400">check 3</text><circle cx="559" cy="135" r="34" fill="#e4f2ee" stroke="#17384a" stroke-width="3"/><text x="559" y="144" font-size="27" fill="#17384a" text-anchor="middle" font-weight="700">18</text><text x="559" y="204" font-size="21" fill="#17384a" text-anchor="middle" font-weight="400">check 4</text></g></svg>
