<svg xmlns="http://www.w3.org/2000/svg" width="640" height="315" viewBox="0 0 640 315" role="img" aria-labelledby="title desc">
<title id="title">Check each pair</title><desc id="desc">The observer cannot distinguish 20 from 21 degrees or 21 from 22, so those pairs have edges. There is no edge between 20 and 22 degrees.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#17384a" stroke-width="2"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><rect x="1" y="1" width="638" height="313" rx="22" fill="#fffdf7" stroke="#d9e1dc" stroke-width="2"/><text x="26" y="40" font-size="27" fill="#17384a" text-anchor="start" font-weight="700">Check each pair</text><path d="M92,210 L320,111" fill="none" stroke="#2b8187" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M320,111 L548,210" fill="none" stroke="#2b8187" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="92" cy="210" r="36" fill="#e4f2ee" stroke="#17384a" stroke-width="3"/><text x="92" y="219" font-size="27" fill="#17384a" text-anchor="middle" font-weight="700">20°</text><circle cx="320" cy="111" r="36" fill="#e4f2ee" stroke="#17384a" stroke-width="3"/><text x="320" y="120" font-size="27" fill="#17384a" text-anchor="middle" font-weight="700">21°</text><circle cx="548" cy="210" r="36" fill="#e4f2ee" stroke="#17384a" stroke-width="3"/><text x="548" y="219" font-size="27" fill="#17384a" text-anchor="middle" font-weight="700">22°</text><text x="320" y="273" font-size="25" fill="#17384a" text-anchor="middle" font-weight="700">No 20°–22° edge</text></g></svg>
