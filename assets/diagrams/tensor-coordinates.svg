<svg xmlns="http://www.w3.org/2000/svg" width="640" height="375" viewBox="0 0 640 375" role="img" aria-labelledby="title desc">
<title id="title">Same arrow, different coordinates</title><desc id="desc">The same northeast arrow has components three east and two north, or two north and minus three west. Only the coordinate directions change.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#17384a" stroke-width="2"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><rect x="1" y="1" width="638" height="373" rx="22" fill="#fffdf7" stroke="#d9e1dc" stroke-width="2"/><text x="26" y="40" font-size="27" fill="#17384a" text-anchor="start" font-weight="700">Same arrow, different coordinates</text><text x="160" y="79" font-size="25" fill="#17384a" text-anchor="middle" font-weight="700">East, north</text><path d="M100,246 L100,120" fill="none" stroke="#87999f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="100" y="108" font-size="22" fill="#17384a" text-anchor="middle" font-weight="400">N</text><path d="M100,246 L250,246" fill="none" stroke="#87999f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="262" y="254" font-size="22" fill="#17384a" text-anchor="start" font-weight="400">E</text><path d="M100,246 L190,186" fill="none" stroke="#2b8187" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><circle cx="100" cy="246" r="4" fill="#17384a" stroke="#17384a" stroke-width="1"/><text x="100" y="276" font-size="22" fill="#17384a" text-anchor="middle" font-weight="400">gate</text><text x="201" y="181" font-size="22" fill="#17384a" text-anchor="start" font-weight="400">tree</text><text x="160" y="318" font-size="28" fill="#17384a" text-anchor="middle" font-weight="700">(3, 2)</text><text x="490" y="79" font-size="25" fill="#17384a" text-anchor="middle" font-weight="700">North, west</text><path d="M430,246 L430,120" fill="none" stroke="#87999f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="430" y="108" font-size="22" fill="#17384a" text-anchor="middle" font-weight="400">N</text><path d="M430,246 L327,246" fill="none" stroke="#87999f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="308" y="254" font-size="22" fill="#17384a" text-anchor="middle" font-weight="400">W</text><path d="M430,246 L520,186" fill="none" stroke="#2b8187" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><circle cx="430" cy="246" r="4" fill="#17384a" stroke="#17384a" stroke-width="1"/><text x="430" y="276" font-size="22" fill="#17384a" text-anchor="middle" font-weight="400">gate</text><text x="531" y="181" font-size="22" fill="#17384a" text-anchor="start" font-weight="400">tree</text><text x="490" y="318" font-size="28" fill="#17384a" text-anchor="middle" font-weight="700">(2, −3)</text><text x="320" y="354" font-size="23" fill="#17384a" text-anchor="middle" font-weight="400">North stays upward in both pictures.</text></g></svg>
