<svg xmlns="http://www.w3.org/2000/svg" width="640" height="240" viewBox="0 0 640 240" role="img" aria-labelledby="title desc">
<title id="title">One rule: add two</title><desc id="desc">Starting from three, adding two gives five, seven, then nine. All four counts are odd.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#17384a" stroke-width="2"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><rect x="1" y="1" width="638" height="238" rx="22" fill="#fffdf7" stroke="#d9e1dc" stroke-width="2"/><text x="26" y="40" font-size="27" fill="#17384a" text-anchor="start" font-weight="700">One rule: add two</text><circle cx="80" cy="126" r="29" fill="#e4f2ee" stroke="#17384a" stroke-width="3"/><text x="80" y="135" font-size="27" fill="#17384a" text-anchor="middle" font-weight="700">3</text><path d="M118,126 L193,126" fill="none" stroke="#17384a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="160" y="101" font-size="23" fill="#17384a" text-anchor="middle" font-weight="400">+2</text><circle cx="240" cy="126" r="29" fill="#e4f2ee" stroke="#17384a" stroke-width="3"/><text x="240" y="135" font-size="27" fill="#17384a" text-anchor="middle" font-weight="700">5</text><path d="M278,126 L353,126" fill="none" stroke="#17384a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="320" y="101" font-size="23" fill="#17384a" text-anchor="middle" font-weight="400">+2</text><circle cx="400" cy="126" r="29" fill="#e4f2ee" stroke="#17384a" stroke-width="3"/><text x="400" y="135" font-size="27" fill="#17384a" text-anchor="middle" font-weight="700">7</text><path d="M438,126 L513,126" fill="none" stroke="#17384a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="480" y="101" font-size="23" fill="#17384a" text-anchor="middle" font-weight="400">+2</text><circle cx="560" cy="126" r="29" fill="#e4f2ee" stroke="#17384a" stroke-width="3"/><text x="560" y="135" font-size="27" fill="#17384a" text-anchor="middle" font-weight="700">9</text><text x="320" y="209" font-size="23" fill="#17384a" text-anchor="middle" font-weight="400">The starting count and the move both matter.</text></g></svg>
