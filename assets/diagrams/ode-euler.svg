<svg xmlns="http://www.w3.org/2000/svg" width="640" height="376" viewBox="0 0 640 376" role="img" aria-labelledby="title desc">
<title id="title">Recalculate the rate halfway through</title><desc id="desc">One one-minute Euler step goes from four to eight liters. Two half-minute steps go from four to six to seven and a half liters. The continuous model gives about seven point one five liters at one minute.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#17384a" stroke-width="2"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><rect x="1" y="1" width="638" height="374" rx="22" fill="#fffdf7" stroke="#d9e1dc" stroke-width="2"/><text x="26" y="40" font-size="27" fill="#17384a" text-anchor="start" font-weight="700">Recalculate the rate halfway through</text><text x="159" y="91" font-size="23" fill="#17384a" text-anchor="middle" font-weight="700">0 min</text><text x="346" y="91" font-size="23" fill="#17384a" text-anchor="middle" font-weight="700">½ min</text><text x="548" y="91" font-size="23" fill="#17384a" text-anchor="middle" font-weight="700">1 min</text><text x="27" y="160" font-size="24" fill="#17384a" text-anchor="start" font-weight="600">1 step</text><path d="M199,152 L508,152" fill="none" stroke="#17384a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><circle cx="159" cy="152" r="32" fill="#e4f2ee" stroke="#17384a" stroke-width="3"/><text x="159" y="161" font-size="27" fill="#17384a" text-anchor="middle" font-weight="700">4</text><circle cx="548" cy="152" r="32" fill="#e4f2ee" stroke="#17384a" stroke-width="3"/><text x="548" y="161" font-size="27" fill="#17384a" text-anchor="middle" font-weight="700">8</text><text x="27" y="268" font-size="24" fill="#17384a" text-anchor="start" font-weight="600">2 steps</text><path d="M199,260 L306,260" fill="none" stroke="#17384a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M386,260 L508,260" fill="none" stroke="#17384a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><circle cx="159" cy="260" r="32" fill="#e4f2ee" stroke="#17384a" stroke-width="3"/><text x="159" y="269" font-size="27" fill="#17384a" text-anchor="middle" font-weight="700">4</text><circle cx="346" cy="260" r="32" fill="#e4f2ee" stroke="#17384a" stroke-width="3"/><text x="346" y="269" font-size="27" fill="#17384a" text-anchor="middle" font-weight="700">6</text><circle cx="548" cy="260" r="32" fill="#e4f2ee" stroke="#17384a" stroke-width="3"/><text x="548" y="269" font-size="27" fill="#17384a" text-anchor="middle" font-weight="700">7.5</text><text x="350" y="142" font-size="23" fill="#17384a" text-anchor="middle" font-weight="400">+4 × 1</text><text x="252" y="245" font-size="22" fill="#17384a" text-anchor="middle" font-weight="400">+4 × ½</text><text x="447" y="245" font-size="22" fill="#17384a" text-anchor="middle" font-weight="400">+3 × ½</text><text x="320" y="335" font-size="22" fill="#17384a" text-anchor="middle" font-weight="400">Amounts in liters</text><text x="320" y="363" font-size="23" fill="#17384a" text-anchor="middle" font-weight="600">Continuous model at 1 minute: about 7.15 L</text></g></svg>
