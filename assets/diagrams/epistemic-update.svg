<svg xmlns="http://www.w3.org/2000/svg" width="640" height="285" viewBox="0 0 640 285" role="img" aria-labelledby="title desc">
<title id="title">Everyone hears: “The card is red”</title><desc id="desc">After a truthful public announcement of red, Jo still allows A and B. Sam rules out blue card C, leaving only A.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#17384a" stroke-width="2"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><rect x="1" y="1" width="638" height="283" rx="22" fill="#fffdf7" stroke="#d9e1dc" stroke-width="2"/><text x="26" y="40" font-size="27" fill="#17384a" text-anchor="start" font-weight="700">Everyone hears: “The card is red”</text><text x="212" y="90" font-size="23" fill="#17384a" text-anchor="middle" font-weight="700">Before</text><text x="511" y="90" font-size="23" fill="#17384a" text-anchor="middle" font-weight="700">After</text><text x="37" y="148" font-size="25" fill="#17384a" text-anchor="start" font-weight="700">Jo</text><rect x="133.0" y="112" width="158" height="52" rx="14" fill="#e4f2ee" stroke="none" stroke-width="0"/><text x="212" y="147" font-size="23" fill="#17384a" text-anchor="middle" font-weight="600">A or B</text><path d="M304,137 L415,137" fill="none" stroke="#17384a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="432.0" y="112" width="158" height="52" rx="14" fill="#e4f2ee" stroke="none" stroke-width="0"/><text x="511" y="147" font-size="23" fill="#17384a" text-anchor="middle" font-weight="600">A or B</text><text x="37" y="232" font-size="25" fill="#17384a" text-anchor="start" font-weight="700">Sam</text><rect x="133.0" y="196" width="158" height="52" rx="14" fill="#e4f2ee" stroke="none" stroke-width="0"/><text x="212" y="231" font-size="23" fill="#17384a" text-anchor="middle" font-weight="600">A or C</text><path d="M304,221 L415,221" fill="none" stroke="#17384a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="432.0" y="196" width="158" height="52" rx="14" fill="#efbb4d" stroke="none" stroke-width="0"/><text x="511" y="231" font-size="23" fill="#17384a" text-anchor="middle" font-weight="600">A</text></g></svg>
