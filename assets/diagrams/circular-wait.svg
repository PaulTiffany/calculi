<svg xmlns="http://www.w3.org/2000/svg" width="640" height="350" viewBox="0 0 640 350" role="img" aria-labelledby="title desc">
<title id="title">Both wait; neither lets go</title><desc id="desc">Jo holds the printer and waits for Sam&#x27;s scissors. Sam holds the scissors and waits for Jo&#x27;s printer. Their waiting forms a loop.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#17384a" stroke-width="2"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><rect x="1" y="1" width="638" height="348" rx="22" fill="#fffdf7" stroke="#d9e1dc" stroke-width="2"/><text x="26" y="40" font-size="27" fill="#17384a" text-anchor="start" font-weight="700">Both wait; neither lets go</text><rect x="47" y="111" width="194" height="133" rx="20" fill="#e4f2ee" stroke="#2b8187" stroke-width="3"/><rect x="399" y="111" width="194" height="133" rx="20" fill="#fbe6de" stroke="#b74d32" stroke-width="3"/><text x="144" y="148" font-size="29" fill="#17384a" text-anchor="middle" font-weight="700">Jo</text><text x="144" y="185" font-size="23" fill="#17384a" text-anchor="middle" font-weight="400">holds</text><text x="144" y="220" font-size="26" fill="#17384a" text-anchor="middle" font-weight="400">printer</text><text x="496" y="148" font-size="29" fill="#17384a" text-anchor="middle" font-weight="700">Sam</text><text x="496" y="185" font-size="23" fill="#17384a" text-anchor="middle" font-weight="400">holds</text><text x="496" y="220" font-size="26" fill="#17384a" text-anchor="middle" font-weight="400">scissors</text><path d="M144,103 C144,63 496,63 496,103" fill="none" stroke="#17384a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="217" y="62" width="206" height="28" rx="0" fill="#fffdf7" stroke="none" stroke-width="0"/><text x="320" y="83" font-size="23" fill="#17384a" text-anchor="middle" font-weight="400">needs scissors</text><path d="M496,252 C496,302 144,302 144,252" fill="none" stroke="#17384a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="217" y="269" width="206" height="28" rx="0" fill="#fffdf7" stroke="none" stroke-width="0"/><text x="320" y="290" font-size="23" fill="#17384a" text-anchor="middle" font-weight="400">needs printer</text><text x="320" y="331" font-size="23" fill="#17384a" text-anchor="middle" font-weight="400">What could let one person continue?</text></g></svg>
