<svg xmlns="http://www.w3.org/2000/svg" width="640" height="389" viewBox="0 0 640 389" role="img" aria-labelledby="title desc">
<title id="title">Move a boundary with its contents</title><desc id="desc">Before entry, bag and van are side by side, and parcel is inside bag. After bag enters van, parcel remains inside bag, and bag is inside van.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#17384a" stroke-width="2"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><rect x="1" y="1" width="638" height="387" rx="22" fill="#fffdf7" stroke="#d9e1dc" stroke-width="2"/><text x="26" y="40" font-size="27" fill="#17384a" text-anchor="start" font-weight="700">Move a boundary with its contents</text><text x="162" y="89" font-size="25" fill="#17384a" text-anchor="middle" font-weight="700">Before</text><text x="478" y="89" font-size="25" fill="#17384a" text-anchor="middle" font-weight="700">After</text><rect x="32" y="118" width="145" height="204" rx="12" fill="#e4f2ee" stroke="#2b8187" stroke-width="3"/><text x="105" y="153" font-size="25" fill="#17384a" text-anchor="middle" font-weight="700">bag</text><rect x="48" y="232" width="113" height="60" rx="8" fill="#efbb4d" stroke="#17384a" stroke-width="2"/><text x="105" y="269" font-size="24" fill="#17384a" text-anchor="middle" font-weight="400">parcel</text><rect x="197" y="159" width="103" height="163" rx="12" fill="white" stroke="#17384a" stroke-width="3"/><text x="249" y="195" font-size="25" fill="#17384a" text-anchor="middle" font-weight="700">van</text><path d="M310,216 L340,216" fill="none" stroke="#17384a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="354" y="118" width="254" height="204" rx="12" fill="white" stroke="#17384a" stroke-width="3"/><text x="481" y="153" font-size="25" fill="#17384a" text-anchor="middle" font-weight="700">van</text><rect x="376" y="172" width="210" height="134" rx="10" fill="#e4f2ee" stroke="#2b8187" stroke-width="3"/><text x="481" y="208" font-size="25" fill="#17384a" text-anchor="middle" font-weight="700">bag</text><rect x="420" y="231" width="122" height="58" rx="8" fill="#efbb4d" stroke="#17384a" stroke-width="2"/><text x="481" y="268" font-size="24" fill="#17384a" text-anchor="middle" font-weight="400">parcel</text><text x="320" y="368" font-size="24" fill="#17384a" text-anchor="middle" font-weight="400">Action inside bag: in van</text></g></svg>
