<svg xmlns="http://www.w3.org/2000/svg" width="640" height="245" viewBox="0 0 640 245" role="img" aria-labelledby="title desc">
<title id="title">Work backward from the promise</title><desc id="desc">An unknown starting score is reduced by three points. The required result is nonnegative. The starting condition is left for the reader.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#17384a" stroke-width="2"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><rect x="1" y="1" width="638" height="243" rx="22" fill="#fffdf7" stroke="#d9e1dc" stroke-width="2"/><text x="26" y="40" font-size="27" fill="#17384a" text-anchor="start" font-weight="700">Work backward from the promise</text><rect x="36.5" y="107" width="187" height="52" rx="14" fill="#e4f2ee" stroke="none" stroke-width="0"/><text x="130" y="142" font-size="23" fill="#17384a" text-anchor="middle" font-weight="600">start: ?</text><path d="M236,131 L404,131" fill="none" stroke="#17384a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="320" y="104" font-size="24" fill="#17384a" text-anchor="middle" font-weight="400">subtract 3</text><rect x="420.0" y="107" width="188" height="52" rx="14" fill="#fff1ce" stroke="none" stroke-width="0"/><text x="514" y="142" font-size="23" fill="#17384a" text-anchor="middle" font-weight="600">finish ≥ 0</text></g></svg>
