<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" role="img" aria-labelledby="title desc">
<title id="title">A description is not its execution</title><desc id="desc">One panel shows a stored recipe card. The other shows using that recipe to bake. Keeping a description does not automatically run its instructions.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#17384a" stroke-width="2"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><rect x="1" y="1" width="638" height="298" rx="22" fill="#fffdf7" stroke="#d9e1dc" stroke-width="2"/><text x="26" y="40" font-size="27" fill="#17384a" text-anchor="start" font-weight="700">A description is not its execution</text><rect x="63" y="90" width="166" height="127" rx="9" fill="white" stroke="#17384a" stroke-width="3"/><rect x="105" y="124" width="80" height="65" rx="8" fill="#fff1ce" stroke="#17384a" stroke-width="3"/><path d="M116,142 L171,142" fill="none" stroke="#17384a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M116,160 L171,160" fill="none" stroke="#17384a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M116,178 L171,178" fill="none" stroke="#17384a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="145" y="257" font-size="24" fill="#17384a" text-anchor="middle" font-weight="400">Keep the recipe</text><rect x="395" y="88" width="183" height="133" rx="12" fill="#e4f2ee" stroke="#17384a" stroke-width="3"/><rect x="412" y="126" width="147" height="76" rx="9" fill="white" stroke="#17384a" stroke-width="3"/><circle cx="425" cy="108" r="4" fill="#efbb4d" stroke="#17384a" stroke-width="2"/><circle cx="454" cy="108" r="4" fill="#efbb4d" stroke="#17384a" stroke-width="2"/><circle cx="483" cy="108" r="4" fill="#efbb4d" stroke="#17384a" stroke-width="2"/><path d="M444,178 Q435,154 451,158 Q463,138 476,157 Q490,146 503,160 Q518,158 511,179 Z" fill="#efbb4d" stroke="#17384a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="451" y="179" width="55" height="15" rx="4" fill="#f7dfb2" stroke="#17384a" stroke-width="2"/><text x="486" y="257" font-size="24" fill="#17384a" text-anchor="middle" font-weight="400">Use it to bake</text></g></svg>
