<svg xmlns="http://www.w3.org/2000/svg" width="640" height="338" viewBox="0 0 640 338" role="img" aria-labelledby="title desc">
<title id="title">Work backward from the promise</title><desc id="desc">Reasoning backward begins with the goal of at least seven, moves to at least ten before deducting three, and then at least five before doubling. The program itself runs in the opposite order.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#17384a" stroke-width="2"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><rect x="1" y="1" width="638" height="336" rx="22" fill="#fffdf7" stroke="#d9e1dc" stroke-width="2"/><text x="26" y="40" font-size="27" fill="#17384a" text-anchor="start" font-weight="700">Work backward from the promise</text><rect x="49.0" y="111" width="122" height="52" rx="14" fill="#e4f2ee" stroke="none" stroke-width="0"/><text x="110" y="146" font-size="23" fill="#17384a" text-anchor="middle" font-weight="600">≥ 5</text><text x="110" y="201" font-size="23" fill="#17384a" text-anchor="middle" font-weight="400">Before</text><text x="110" y="229" font-size="23" fill="#17384a" text-anchor="middle" font-weight="400">doubling</text><rect x="259.0" y="111" width="122" height="52" rx="14" fill="#e4f2ee" stroke="none" stroke-width="0"/><text x="320" y="146" font-size="23" fill="#17384a" text-anchor="middle" font-weight="600">≥ 10</text><text x="320" y="201" font-size="23" fill="#17384a" text-anchor="middle" font-weight="400">Before</text><text x="320" y="229" font-size="23" fill="#17384a" text-anchor="middle" font-weight="400">deducting 3</text><rect x="469.0" y="111" width="122" height="52" rx="14" fill="#e4f2ee" stroke="none" stroke-width="0"/><text x="530" y="146" font-size="23" fill="#17384a" text-anchor="middle" font-weight="600">≥ 7</text><text x="530" y="201" font-size="23" fill="#17384a" text-anchor="middle" font-weight="400">Goal at</text><text x="530" y="229" font-size="23" fill="#17384a" text-anchor="middle" font-weight="400">the end</text><path d="M464,135 L385,135" fill="none" stroke="#17384a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M254,135 L175,135" fill="none" stroke="#17384a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="320" y="85" font-size="22" fill="#17384a" text-anchor="middle" font-weight="400">Required conditions move left</text><path d="M67,281 L572,281" fill="none" stroke="#17384a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="320" y="317" font-size="23" fill="#17384a" text-anchor="middle" font-weight="400">Program: double, then deduct 3</text></g></svg>
