<svg xmlns="http://www.w3.org/2000/svg" width="640" height="390" viewBox="0 0 640 390" role="img" aria-labelledby="title desc">
<title id="title">Separate cells: preserve the rest</title><desc id="desc">Before an update, p points to address twelve holding four, and q to address twenty-seven also holding four. After storing nine through p, only address twelve changes; address twenty-seven still holds four.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#17384a" stroke-width="2"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><rect x="1" y="1" width="638" height="388" rx="22" fill="#fffdf7" stroke="#d9e1dc" stroke-width="2"/><text x="26" y="40" font-size="27" fill="#17384a" text-anchor="start" font-weight="700">Separate cells: preserve the rest</text><path d="M320,65 L320,345" fill="none" stroke="#ccd8d4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="160" y="87" font-size="24" fill="#17384a" text-anchor="middle" font-weight="700">Before</text><rect x="31.0" y="131" width="50" height="52" rx="14" fill="#e4f2ee" stroke="none" stroke-width="0"/><text x="56" y="166" font-size="23" fill="#17384a" text-anchor="middle" font-weight="600">p</text><path d="M92,156 L129,156" fill="none" stroke="#17384a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="145" y="116" width="132" height="89" rx="10" fill="#e4f2ee" stroke="#17384a" stroke-width="3"/><text x="211" y="153" font-size="30" fill="#17384a" text-anchor="middle" font-weight="700">4</text><text x="211" y="189" font-size="20" fill="#17384a" text-anchor="middle" font-weight="400">address 12</text><rect x="31.0" y="254" width="50" height="52" rx="14" fill="#e4f2ee" stroke="none" stroke-width="0"/><text x="56" y="289" font-size="23" fill="#17384a" text-anchor="middle" font-weight="600">q</text><path d="M92,279 L129,279" fill="none" stroke="#17384a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="145" y="239" width="132" height="89" rx="10" fill="#e4f2ee" stroke="#17384a" stroke-width="3"/><text x="211" y="276" font-size="30" fill="#17384a" text-anchor="middle" font-weight="700">4</text><text x="211" y="312" font-size="20" fill="#17384a" text-anchor="middle" font-weight="400">address 27</text><text x="480" y="87" font-size="24" fill="#17384a" text-anchor="middle" font-weight="700">After writing 9</text><rect x="351.0" y="131" width="50" height="52" rx="14" fill="#e4f2ee" stroke="none" stroke-width="0"/><text x="376" y="166" font-size="23" fill="#17384a" text-anchor="middle" font-weight="600">p</text><path d="M412,156 L449,156" fill="none" stroke="#17384a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="465" y="116" width="132" height="89" rx="10" fill="#efbb4d" stroke="#17384a" stroke-width="3"/><text x="531" y="153" font-size="30" fill="#17384a" text-anchor="middle" font-weight="700">9</text><text x="531" y="189" font-size="20" fill="#17384a" text-anchor="middle" font-weight="400">address 12</text><rect x="351.0" y="254" width="50" height="52" rx="14" fill="#e4f2ee" stroke="none" stroke-width="0"/><text x="376" y="289" font-size="23" fill="#17384a" text-anchor="middle" font-weight="600">q</text><path d="M412,279 L449,279" fill="none" stroke="#17384a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="465" y="239" width="132" height="89" rx="10" fill="#e4f2ee" stroke="#17384a" stroke-width="3"/><text x="531" y="276" font-size="30" fill="#17384a" text-anchor="middle" font-weight="700">4</text><text x="531" y="312" font-size="20" fill="#17384a" text-anchor="middle" font-weight="400">address 27</text><text x="320" y="366" font-size="23" fill="#17384a" text-anchor="middle" font-weight="400">q&#x27;s separate cell is the unchanged frame.</text></g></svg>
