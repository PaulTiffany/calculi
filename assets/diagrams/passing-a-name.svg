<svg xmlns="http://www.w3.org/2000/svg" width="640" height="330" viewBox="0 0 640 330" role="img" aria-labelledby="title desc">
<title id="title">Pass a name; gain a connection</title><desc id="desc">Before the message, Alice knows a and b, and Bob knows a. Alice sends b on a. Afterward Bob knows both a and b; Alice keeps both names.</desc>
