<title id="title">Straight joins estimate a curved flow</title><desc id="desc">Two graphs show the known flow curve q equals time squared from zero to four minutes. Straight joins using two-minute steps give twenty-four liters; one-minute steps give twenty-two. Both lie above the curved flow, whose exact total is twenty-one and one-third liters.</desc>
