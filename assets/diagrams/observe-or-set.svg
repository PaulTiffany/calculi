<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
<title id="title">Observe a clue; or change a setting</title><desc id="desc">In the observation model, heat affects both sprinklers and drink buying. Under an intervention setting sprinklers, heat still affects drink buying, but no longer determines the sprinkler setting.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#17384a" stroke-width="2"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><rect x="1" y="1" width="638" height="358" rx="22" fill="#fffdf7" stroke="#d9e1dc" stroke-width="2"/><text x="26" y="40" font-size="27" fill="#17384a" text-anchor="start" font-weight="700">Observe a clue; or change a setting</text><text x="160" y="82" font-size="25" fill="#17384a" text-anchor="middle" font-weight="700">Observe</text><circle cx="162" cy="143" r="25" fill="#efbb4d" stroke="#17384a" stroke-width="3"/><text x="162" y="152" font-size="27" fill="#17384a" text-anchor="middle" font-weight="700"></text><text x="162" y="112" font-size="23" fill="#17384a" text-anchor="middle" font-weight="400">heat</text><rect x="18.5" y="235" width="131" height="52" rx="14" fill="#8bcce5" stroke="none" stroke-width="0"/><text x="84" y="270" font-size="23" fill="#17384a" text-anchor="middle" font-weight="600">sprinkler</text><rect x="189.5" y="235" width="109" height="52" rx="14" fill="#fbe6de" stroke="none" stroke-width="0"/><text x="244" y="270" font-size="23" fill="#17384a" text-anchor="middle" font-weight="600">drinks</text><path d="M177,168 L237,224" fill="none" stroke="#17384a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M147,168 L90,224" fill="none" stroke="#17384a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="480" y="82" font-size="25" fill="#17384a" text-anchor="middle" font-weight="700">Set the sprinkler</text><circle cx="482" cy="143" r="25" fill="#efbb4d" stroke="#17384a" stroke-width="3"/><text x="482" y="152" font-size="27" fill="#17384a" text-anchor="middle" font-weight="700"></text><text x="482" y="112" font-size="23" fill="#17384a" text-anchor="middle" font-weight="400">heat</text><rect x="338.5" y="235" width="131" height="52" rx="14" fill="#8bcce5" stroke="none" stroke-width="0"/><text x="404" y="270" font-size="23" fill="#17384a" text-anchor="middle" font-weight="600">sprinkler</text><rect x="509.5" y="235" width="109" height="52" rx="14" fill="#fbe6de" stroke="none" stroke-width="0"/><text x="564" y="270" font-size="23" fill="#17384a" text-anchor="middle" font-weight="600">drinks</text><path d="M497,168 L557,224" fill="none" stroke="#17384a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="402" y="195" font-size="21" fill="#17384a" text-anchor="middle" font-weight="400">you set it</text><path d="M404,204 L404,227" fill="none" stroke="#17384a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M320,99 L320,300" fill="none" stroke="#d9e1dc" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="320" y="335" font-size="23" fill="#17384a" text-anchor="middle" font-weight="400">Switching a sprinkler does not make it hot.</text></g></svg>
