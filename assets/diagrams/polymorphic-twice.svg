<svg xmlns="http://www.w3.org/2000/svg" width="640" height="340" viewBox="0 0 640 340" role="img" aria-labelledby="title desc">
<title id="title">One recipe, two chosen types</title><desc id="desc">The same twice recipe uses add three to send four to seven to ten, and uses flip to send on to off to on. Each row keeps one value type throughout.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#17384a" stroke-width="2"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><rect x="1" y="1" width="638" height="338" rx="22" fill="#fffdf7" stroke="#d9e1dc" stroke-width="2"/><text x="26" y="40" font-size="27" fill="#17384a" text-anchor="start" font-weight="700">One recipe, two chosen types</text><text x="35" y="136" font-size="26" fill="#17384a" text-anchor="start" font-weight="700">Count</text><rect x="167.0" y="100" width="98" height="52" rx="14" fill="#e4f2ee" stroke="none" stroke-width="0"/><text x="216" y="135" font-size="23" fill="#17384a" text-anchor="middle" font-weight="600">4</text><rect x="340.0" y="100" width="98" height="52" rx="14" fill="#e4f2ee" stroke="none" stroke-width="0"/><text x="389" y="135" font-size="23" fill="#17384a" text-anchor="middle" font-weight="600">7</text><rect x="513.0" y="100" width="98" height="52" rx="14" fill="#e4f2ee" stroke="none" stroke-width="0"/><text x="562" y="135" font-size="23" fill="#17384a" text-anchor="middle" font-weight="600">10</text><path d="M275,126 L327,126" fill="none" stroke="#17384a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="301" y="99" font-size="22" fill="#17384a" text-anchor="middle" font-weight="400">+3</text><path d="M448,126 L500,126" fill="none" stroke="#17384a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="474" y="99" font-size="22" fill="#17384a" text-anchor="middle" font-weight="400">+3</text><text x="35" y="253" font-size="26" fill="#17384a" text-anchor="start" font-weight="700">Flag</text><rect x="167.0" y="217" width="98" height="52" rx="14" fill="#f8e6c1" stroke="none" stroke-width="0"/><text x="216" y="252" font-size="23" fill="#17384a" text-anchor="middle" font-weight="600">on</text><rect x="340.0" y="217" width="98" height="52" rx="14" fill="#f8e6c1" stroke="none" stroke-width="0"/><text x="389" y="252" font-size="23" fill="#17384a" text-anchor="middle" font-weight="600">off</text><rect x="513.0" y="217" width="98" height="52" rx="14" fill="#f8e6c1" stroke="none" stroke-width="0"/><text x="562" y="252" font-size="23" fill="#17384a" text-anchor="middle" font-weight="600">on</text><path d="M275,243 L327,243" fill="none" stroke="#17384a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="301" y="216" font-size="22" fill="#17384a" text-anchor="middle" font-weight="400">flip</text><path d="M448,243 L500,243" fill="none" stroke="#17384a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="474" y="216" font-size="22" fill="#17384a" text-anchor="middle" font-weight="400">flip</text><text x="320" y="310" font-size="24" fill="#17384a" text-anchor="middle" font-weight="400">Each output fits the next input.</text></g></svg>
