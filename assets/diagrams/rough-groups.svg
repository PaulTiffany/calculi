<svg xmlns="http://www.w3.org/2000/svg" width="640" height="340" viewBox="0 0 640 340" role="img" aria-labelledby="title desc">
<title id="title">Which crates share a record?</title><desc id="desc">Batch A contains ready crates 1 and 2. Batch B contains ready crate 3 and not-ready crate 4. Batch C contains not-ready crates 5 and 6. The scanner reports only the batch letter.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#17384a" stroke-width="2"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><rect x="1" y="1" width="638" height="338" rx="22" fill="#fffdf7" stroke="#d9e1dc" stroke-width="2"/><text x="26" y="40" font-size="27" fill="#17384a" text-anchor="start" font-weight="700">Which crates share a record?</text><rect x="25" y="75" width="170" height="212" rx="14" fill="white" stroke="#a8babc" stroke-width="2"/><text x="110" y="109" font-size="25" fill="#17384a" text-anchor="middle" font-weight="700">Batch A</text><circle cx="68" cy="164" r="24" fill="#e4f2ee" stroke="#17384a" stroke-width="3"/><text x="68" y="173" font-size="27" fill="#17384a" text-anchor="middle" font-weight="700">1</text><text x="137" y="171" font-size="23" fill="#17384a" text-anchor="middle" font-weight="400">ready</text><circle cx="68" cy="239" r="24" fill="#e4f2ee" stroke="#17384a" stroke-width="3"/><text x="68" y="248" font-size="27" fill="#17384a" text-anchor="middle" font-weight="700">2</text><text x="137" y="246" font-size="23" fill="#17384a" text-anchor="middle" font-weight="400">ready</text><rect x="235" y="75" width="170" height="212" rx="14" fill="white" stroke="#a8babc" stroke-width="2"/><text x="320" y="109" font-size="25" fill="#17384a" text-anchor="middle" font-weight="700">Batch B</text><circle cx="278" cy="164" r="24" fill="#e4f2ee" stroke="#17384a" stroke-width="3"/><text x="278" y="173" font-size="27" fill="#17384a" text-anchor="middle" font-weight="700">3</text><text x="347" y="171" font-size="23" fill="#17384a" text-anchor="middle" font-weight="400">ready</text><circle cx="278" cy="239" r="24" fill="#f5ddd5" stroke="#17384a" stroke-width="3"/><text x="278" y="248" font-size="27" fill="#17384a" text-anchor="middle" font-weight="700">4</text><text x="347" y="246" font-size="23" fill="#17384a" text-anchor="middle" font-weight="400">not</text><rect x="445" y="75" width="170" height="212" rx="14" fill="white" stroke="#a8babc" stroke-width="2"/><text x="530" y="109" font-size="25" fill="#17384a" text-anchor="middle" font-weight="700">Batch C</text><circle cx="488" cy="164" r="24" fill="#f5ddd5" stroke="#17384a" stroke-width="3"/><text x="488" y="173" font-size="27" fill="#17384a" text-anchor="middle" font-weight="700">5</text><text x="557" y="171" font-size="23" fill="#17384a" text-anchor="middle" font-weight="400">not</text><circle cx="488" cy="239" r="24" fill="#f5ddd5" stroke="#17384a" stroke-width="3"/><text x="488" y="248" font-size="27" fill="#17384a" text-anchor="middle" font-weight="700">6</text><text x="557" y="246" font-size="23" fill="#17384a" text-anchor="middle" font-weight="400">not</text><text x="320" y="322" font-size="24" fill="#17384a" text-anchor="middle" font-weight="400">Target: ready crates 1, 2, 3.</text></g></svg>
