<svg xmlns="http://www.w3.org/2000/svg" width="640" height="270" viewBox="0 0 640 270" role="img" aria-labelledby="title desc">
<title id="title">Sell one ticket</title><desc id="desc">Four tickets become three when one is sold. A nonnegative count after selling requires at least one ticket beforehand.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#17384a" stroke-width="2"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><rect x="1" y="1" width="638" height="268" rx="22" fill="#fffdf7" stroke="#d9e1dc" stroke-width="2"/><text x="26" y="40" font-size="27" fill="#17384a" text-anchor="start" font-weight="700">Sell one ticket</text><text x="42" y="90" font-size="25" fill="#17384a" text-anchor="start" font-weight="700">Before: 4</text><rect x="42" y="118" width="29" height="64" rx="5" fill="#fff1ce" stroke="#17384a" stroke-width="2"/><rect x="81" y="118" width="29" height="64" rx="5" fill="#fff1ce" stroke="#17384a" stroke-width="2"/><rect x="120" y="118" width="29" height="64" rx="5" fill="#fff1ce" stroke="#17384a" stroke-width="2"/><rect x="159" y="118" width="29" height="64" rx="5" fill="#fff1ce" stroke="#17384a" stroke-width="2"/><text x="402" y="90" font-size="25" fill="#17384a" text-anchor="start" font-weight="700">After: 3</text><rect x="402" y="118" width="29" height="64" rx="5" fill="#fff1ce" stroke="#17384a" stroke-width="2"/><rect x="441" y="118" width="29" height="64" rx="5" fill="#fff1ce" stroke="#17384a" stroke-width="2"/><rect x="480" y="118" width="29" height="64" rx="5" fill="#fff1ce" stroke="#17384a" stroke-width="2"/><path d="M221,147 L374,147" fill="none" stroke="#17384a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="296" y="125" font-size="24" fill="#17384a" text-anchor="middle" font-weight="400">sell 1</text><text x="320" y="232" font-size="25" fill="#17384a" text-anchor="middle" font-weight="700">Before selling: at least 1 ticket.</text></g></svg>
