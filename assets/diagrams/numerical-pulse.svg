<svg xmlns="http://www.w3.org/2000/svg" width="640" height="383" viewBox="0 0 640 383" role="img" aria-labelledby="title desc">
<title id="title">The readings can miss a whole pulse</title><desc id="desc">Zero flow throughout and a triangular pulse share zero-valued readings at minutes zero and one. The pulse peaks at four liters per minute halfway through and adds two liters that the endpoint-only estimate misses.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#17384a" stroke-width="2"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><rect x="1" y="1" width="638" height="381" rx="22" fill="#fffdf7" stroke="#d9e1dc" stroke-width="2"/><text x="26" y="40" font-size="27" fill="#17384a" text-anchor="start" font-weight="700">The readings can miss a whole pulse</text><text x="170" y="85" font-size="24" fill="#17384a" text-anchor="middle" font-weight="700">No flow</text><path d="M57,264 L299,264" fill="none" stroke="#17384a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M57,264 L57,115" fill="none" stroke="#17384a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M57,264 L292,264" fill="none" stroke="#2b8187" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="57" cy="264" r="7" fill="#efbb4d" stroke="#17384a" stroke-width="2"/><text x="57" y="294" font-size="22" fill="#17384a" text-anchor="middle" font-weight="400">0</text><text x="57" y="246" font-size="22" fill="#17384a" text-anchor="middle" font-weight="400">0</text><circle cx="292" cy="264" r="7" fill="#efbb4d" stroke="#17384a" stroke-width="2"/><text x="292" y="294" font-size="22" fill="#17384a" text-anchor="middle" font-weight="400">1</text><text x="292" y="246" font-size="22" fill="#17384a" text-anchor="middle" font-weight="400">0</text><text x="175" y="331" font-size="25" fill="#17384a" text-anchor="middle" font-weight="700">Added: 0 L</text><text x="490" y="85" font-size="24" fill="#17384a" text-anchor="middle" font-weight="700">Hidden pulse</text><path d="M377,264 L619,264" fill="none" stroke="#17384a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M377,264 L377,115" fill="none" stroke="#17384a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M377,264 L494.5,130 L612,264 Z" fill="#fbe6de" stroke="#b74d32" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="494.5" y="118" font-size="22" fill="#17384a" text-anchor="middle" font-weight="400">4 L/min</text><path d="M494.5,136 L494.5,264" fill="none" stroke="#9b8c82" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6"/><text x="494.5" y="294" font-size="22" fill="#17384a" text-anchor="middle" font-weight="400">½</text><circle cx="377" cy="264" r="7" fill="#efbb4d" stroke="#17384a" stroke-width="2"/><text x="377" y="294" font-size="22" fill="#17384a" text-anchor="middle" font-weight="400">0</text><text x="377" y="246" font-size="22" fill="#17384a" text-anchor="middle" font-weight="400">0</text><circle cx="612" cy="264" r="7" fill="#efbb4d" stroke="#17384a" stroke-width="2"/><text x="612" y="294" font-size="22" fill="#17384a" text-anchor="middle" font-weight="400">1</text><text x="612" y="246" font-size="22" fill="#17384a" text-anchor="middle" font-weight="400">0</text><text x="495" y="331" font-size="25" fill="#17384a" text-anchor="middle" font-weight="700">Added: 2 L</text><text x="320" y="366" font-size="22" fill="#17384a" text-anchor="middle" font-weight="400">Same endpoint readings · time in minutes</text></g></svg>
