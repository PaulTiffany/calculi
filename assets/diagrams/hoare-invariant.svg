<svg xmlns="http://www.w3.org/2000/svg" width="640" height="354" viewBox="0 0 640 354" role="img" aria-labelledby="title desc">
<title id="title">A fixed total and a falling count</title><desc id="desc">At successive loop checks, waiting and finished counts are three and zero, two and one, one and two, then zero and three. The sum remains three while waiting falls by one.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#17384a" stroke-width="2"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><rect x="1" y="1" width="638" height="352" rx="22" fill="#fffdf7" stroke="#d9e1dc" stroke-width="2"/><text x="26" y="40" font-size="27" fill="#17384a" text-anchor="start" font-weight="700">A fixed total and a falling count</text><text x="87" y="88" font-size="23" fill="#17384a" text-anchor="middle" font-weight="700">Start</text><circle cx="87" cy="135" r="29" fill="#e4f2ee" stroke="#17384a" stroke-width="3"/><text x="87" y="144" font-size="27" fill="#17384a" text-anchor="middle" font-weight="700">3</text><circle cx="87" cy="217" r="29" fill="#f8e6c1" stroke="#17384a" stroke-width="3"/><text x="87" y="226" font-size="27" fill="#17384a" text-anchor="middle" font-weight="700">0</text><text x="87" y="280" font-size="22" fill="#17384a" text-anchor="middle" font-weight="400">3 + 0 = 3</text><path d="M126,135 L202,135" fill="none" stroke="#17384a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M126,217 L202,217" fill="none" stroke="#17384a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="242" y="88" font-size="23" fill="#17384a" text-anchor="middle" font-weight="700">1 step</text><circle cx="242" cy="135" r="29" fill="#e4f2ee" stroke="#17384a" stroke-width="3"/><text x="242" y="144" font-size="27" fill="#17384a" text-anchor="middle" font-weight="700">2</text><circle cx="242" cy="217" r="29" fill="#f8e6c1" stroke="#17384a" stroke-width="3"/><text x="242" y="226" font-size="27" fill="#17384a" text-anchor="middle" font-weight="700">1</text><text x="242" y="280" font-size="22" fill="#17384a" text-anchor="middle" font-weight="400">2 + 1 = 3</text><path d="M281,135 L357,135" fill="none" stroke="#17384a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M281,217 L357,217" fill="none" stroke="#17384a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="397" y="88" font-size="23" fill="#17384a" text-anchor="middle" font-weight="700">2 steps</text><circle cx="397" cy="135" r="29" fill="#e4f2ee" stroke="#17384a" stroke-width="3"/><text x="397" y="144" font-size="27" fill="#17384a" text-anchor="middle" font-weight="700">1</text><circle cx="397" cy="217" r="29" fill="#f8e6c1" stroke="#17384a" stroke-width="3"/><text x="397" y="226" font-size="27" fill="#17384a" text-anchor="middle" font-weight="700">2</text><text x="397" y="280" font-size="22" fill="#17384a" text-anchor="middle" font-weight="400">1 + 2 = 3</text><path d="M436,135 L512,135" fill="none" stroke="#17384a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M436,217 L512,217" fill="none" stroke="#17384a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="552" y="88" font-size="23" fill="#17384a" text-anchor="middle" font-weight="700">Done</text><circle cx="552" cy="135" r="29" fill="#e4f2ee" stroke="#17384a" stroke-width="3"/><text x="552" y="144" font-size="27" fill="#17384a" text-anchor="middle" font-weight="700">0</text><circle cx="552" cy="217" r="29" fill="#f8e6c1" stroke="#17384a" stroke-width="3"/><text x="552" y="226" font-size="27" fill="#17384a" text-anchor="middle" font-weight="700">3</text><text x="552" y="280" font-size="22" fill="#17384a" text-anchor="middle" font-weight="400">0 + 3 = 3</text><text x="320" y="328" font-size="23" fill="#17384a" text-anchor="middle" font-weight="400">Top: waiting · Bottom: finished</text></g></svg>
