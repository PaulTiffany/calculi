<svg xmlns="http://www.w3.org/2000/svg" width="640" height="390" viewBox="0 0 640 390" role="img" aria-labelledby="title desc">
<title id="title">Compare the same weather mix</title><desc id="desc">The observed watered and unwatered groups have success rates 50 and 70 percent and different weather mixes. Adjusting both to half mild and half hot gives intervention rates 65 and 55 percent under the stated model.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#17384a" stroke-width="2"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><rect x="1" y="1" width="638" height="388" rx="22" fill="#fffdf7" stroke="#d9e1dc" stroke-width="2"/><text x="26" y="40" font-size="27" fill="#17384a" text-anchor="start" font-weight="700">Compare the same weather mix</text><text x="160" y="88" font-size="24" fill="#17384a" text-anchor="middle" font-weight="700">Observed groups</text><text x="34" y="125" font-size="23" fill="#17384a" text-anchor="start" font-weight="400">Water</text><rect x="34" y="137" width="220" height="28" rx="5" fill="#e8ebe6" stroke="none" stroke-width="0"/><rect x="34" y="137" width="110.00000000000001" height="28" rx="5" fill="#2b8187" stroke="none" stroke-width="0"/><text x="152.0" y="160" font-size="23" fill="#17384a" text-anchor="start" font-weight="700">50%</text><text x="34" y="222" font-size="23" fill="#17384a" text-anchor="start" font-weight="400">No water</text><rect x="34" y="234" width="220" height="28" rx="5" fill="#e8ebe6" stroke="none" stroke-width="0"/><rect x="34" y="234" width="154.0" height="28" rx="5" fill="#b74d32" stroke="none" stroke-width="0"/><text x="196.0" y="257" font-size="23" fill="#17384a" text-anchor="start" font-weight="700">70%</text><text x="160" y="304" font-size="21" fill="#17384a" text-anchor="middle" font-weight="400">Different weather mixes</text><text x="481" y="88" font-size="24" fill="#17384a" text-anchor="middle" font-weight="700">Interventions</text><text x="355" y="125" font-size="23" fill="#17384a" text-anchor="start" font-weight="400">Water</text><rect x="355" y="137" width="220" height="28" rx="5" fill="#e8ebe6" stroke="none" stroke-width="0"/><rect x="355" y="137" width="143.0" height="28" rx="5" fill="#2b8187" stroke="none" stroke-width="0"/><text x="506.0" y="160" font-size="23" fill="#17384a" text-anchor="start" font-weight="700">65%</text><text x="355" y="222" font-size="23" fill="#17384a" text-anchor="start" font-weight="400">No water</text><rect x="355" y="234" width="220" height="28" rx="5" fill="#e8ebe6" stroke="none" stroke-width="0"/><rect x="355" y="234" width="121.00000000000001" height="28" rx="5" fill="#b74d32" stroke="none" stroke-width="0"/><text x="484.0" y="257" font-size="23" fill="#17384a" text-anchor="start" font-weight="700">55%</text><text x="481" y="304" font-size="21" fill="#17384a" text-anchor="middle" font-weight="400">Half mild, half hot</text><text x="320" y="366" font-size="23" fill="#17384a" text-anchor="middle" font-weight="400">Model assumptions justify this adjustment.</text></g></svg>
