<svg xmlns="http://www.w3.org/2000/svg" width="640" height="443" viewBox="0 0 640 443" role="img" aria-labelledby="title desc">
<title id="title">Agree on the next shared event</title><desc id="desc">In the blocked version Jo&#x27;s first event is receipt and Sam&#x27;s first event is handoff, so no shared first event is possible. In the repaired version both begin with handoff and then receipt, so they can agree at each step.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#17384a" stroke-width="2"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><rect x="1" y="1" width="638" height="441" rx="22" fill="#fffdf7" stroke="#d9e1dc" stroke-width="2"/><text x="26" y="40" font-size="27" fill="#17384a" text-anchor="start" font-weight="700">Agree on the next shared event</text><text x="30" y="76" font-size="26" fill="#17384a" text-anchor="start" font-weight="700">Blocked</text><text x="38" y="121" font-size="24" fill="#17384a" text-anchor="start" font-weight="700">Jo</text><rect x="157.5" y="86" width="177" height="52" rx="14" fill="#fbe6de" stroke="none" stroke-width="0"/><text x="246" y="121" font-size="23" fill="#17384a" text-anchor="middle" font-weight="600">Receipt</text><rect x="423.5" y="86" width="177" height="52" rx="14" fill="#fbe6de" stroke="none" stroke-width="0"/><text x="512" y="121" font-size="23" fill="#17384a" text-anchor="middle" font-weight="600">Handoff</text><path d="M347,111 L410,111" fill="none" stroke="#17384a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="38" y="181" font-size="24" fill="#17384a" text-anchor="start" font-weight="700">Sam</text><rect x="157.5" y="146" width="177" height="52" rx="14" fill="#fbe6de" stroke="none" stroke-width="0"/><text x="246" y="181" font-size="23" fill="#17384a" text-anchor="middle" font-weight="600">Handoff</text><rect x="423.5" y="146" width="177" height="52" rx="14" fill="#fbe6de" stroke="none" stroke-width="0"/><text x="512" y="181" font-size="23" fill="#17384a" text-anchor="middle" font-weight="600">Receipt</text><path d="M347,171 L410,171" fill="none" stroke="#17384a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="320" y="226" font-size="23" fill="#17384a" text-anchor="middle" font-weight="600">No shared first event</text><text x="30" y="278" font-size="26" fill="#17384a" text-anchor="start" font-weight="700">Repaired</text><text x="38" y="323" font-size="24" fill="#17384a" text-anchor="start" font-weight="700">Jo</text><rect x="157.5" y="288" width="177" height="52" rx="14" fill="#e4f2ee" stroke="none" stroke-width="0"/><text x="246" y="323" font-size="23" fill="#17384a" text-anchor="middle" font-weight="600">Handoff</text><rect x="423.5" y="288" width="177" height="52" rx="14" fill="#e4f2ee" stroke="none" stroke-width="0"/><text x="512" y="323" font-size="23" fill="#17384a" text-anchor="middle" font-weight="600">Receipt</text><path d="M347,313 L410,313" fill="none" stroke="#17384a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="38" y="383" font-size="24" fill="#17384a" text-anchor="start" font-weight="700">Sam</text><rect x="157.5" y="348" width="177" height="52" rx="14" fill="#e4f2ee" stroke="none" stroke-width="0"/><text x="246" y="383" font-size="23" fill="#17384a" text-anchor="middle" font-weight="600">Handoff</text><rect x="423.5" y="348" width="177" height="52" rx="14" fill="#e4f2ee" stroke="none" stroke-width="0"/><text x="512" y="383" font-size="23" fill="#17384a" text-anchor="middle" font-weight="600">Receipt</text><path d="M347,373 L410,373" fill="none" stroke="#17384a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="320" y="428" font-size="23" fill="#17384a" text-anchor="middle" font-weight="600">Both events can now occur in order</text></g></svg>
