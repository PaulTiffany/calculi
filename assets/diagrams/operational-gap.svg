<svg xmlns="http://www.w3.org/2000/svg" width="640" height="395" viewBox="0 0 640 395" role="img" aria-labelledby="title desc">
<title id="title">Water plus gap always makes twelve</title><desc id="desc">Three bars each span the twelve-liter equilibrium amount. At the start, water four plus gap eight makes twelve. At one minute, about seven point one five plus four point eight five makes twelve. At two minutes, about nine point zero six plus two point nine four makes twelve.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#17384a" stroke-width="2"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><rect x="1" y="1" width="638" height="393" rx="22" fill="#fffdf7" stroke="#d9e1dc" stroke-width="2"/><text x="26" y="40" font-size="27" fill="#17384a" text-anchor="start" font-weight="700">Water plus gap always makes twelve</text><text x="28" y="122" font-size="24" fill="#17384a" text-anchor="start" font-weight="600">0 min</text><rect x="133" y="86" width="470" height="54" rx="0" fill="#efbb4d" stroke="#17384a" stroke-width="2"/><rect x="133" y="86" width="156.66666666666666" height="54" rx="0" fill="#8bcce5" stroke="#17384a" stroke-width="2"/><text x="211.33333333333331" y="121" font-size="25" fill="#17384a" text-anchor="middle" font-weight="700">4</text><text x="446.3333333333333" y="121" font-size="25" fill="#17384a" text-anchor="middle" font-weight="700">8</text><text x="211.33333333333331" y="166" font-size="22" fill="#17384a" text-anchor="middle" font-weight="400">water</text><text x="446.3333333333333" y="166" font-size="22" fill="#17384a" text-anchor="middle" font-weight="400">gap</text><text x="28" y="216" font-size="24" fill="#17384a" text-anchor="start" font-weight="600">1 min</text><rect x="133" y="180" width="470" height="54" rx="0" fill="#efbb4d" stroke="#17384a" stroke-width="2"/><rect x="133" y="180" width="279.95372662337485" height="54" rx="0" fill="#8bcce5" stroke="#17384a" stroke-width="2"/><text x="272.97686331168745" y="215" font-size="25" fill="#17384a" text-anchor="middle" font-weight="700">7.15</text><text x="507.97686331168745" y="215" font-size="25" fill="#17384a" text-anchor="middle" font-weight="700">4.85</text><text x="272.97686331168745" y="260" font-size="22" fill="#17384a" text-anchor="middle" font-weight="400">water</text><text x="507.97686331168745" y="260" font-size="22" fill="#17384a" text-anchor="middle" font-weight="400">gap</text><text x="28" y="310" font-size="24" fill="#17384a" text-anchor="start" font-weight="600">2 min</text><rect x="133" y="274" width="470" height="54" rx="0" fill="#efbb4d" stroke="#17384a" stroke-width="2"/><rect x="133" y="274" width="354.7311084329481" height="54" rx="0" fill="#8bcce5" stroke="#17384a" stroke-width="2"/><text x="310.36555421647404" y="309" font-size="25" fill="#17384a" text-anchor="middle" font-weight="700">9.06</text><text x="545.365554216474" y="309" font-size="25" fill="#17384a" text-anchor="middle" font-weight="700">2.94</text><text x="310.36555421647404" y="354" font-size="22" fill="#17384a" text-anchor="middle" font-weight="400">water</text><text x="545.365554216474" y="354" font-size="22" fill="#17384a" text-anchor="middle" font-weight="400">gap</text><text x="320" y="78" font-size="23" fill="#17384a" text-anchor="middle" font-weight="400">Each bar spans 12 liters</text><text x="320" y="382" font-size="22" fill="#17384a" text-anchor="middle" font-weight="400">Later amounts are rounded to 0.01 liter.</text></g></svg>
