<svg xmlns="http://www.w3.org/2000/svg" width="640" height="353" viewBox="0 0 640 353" role="img" aria-labelledby="title desc">
<title id="title">Both properties must hold in one row</title><desc id="desc">In a two-row catalog, B2 is astronomy and available, while B3 is gardening and unavailable. Each desired property appears somewhere, but no single row is both gardening and available.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#17384a" stroke-width="2"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><rect x="1" y="1" width="638" height="351" rx="22" fill="#fffdf7" stroke="#d9e1dc" stroke-width="2"/><text x="26" y="40" font-size="27" fill="#17384a" text-anchor="start" font-weight="700">Both properties must hold in one row</text><rect x="29" y="76" width="266" height="177" rx="12" fill="#e4f2ee" stroke="#2b8187" stroke-width="2"/><text x="162" y="112" font-size="28" fill="#17384a" text-anchor="middle" font-weight="700">B2</text><text x="162" y="153" font-size="25" fill="#17384a" text-anchor="middle" font-weight="400">Astronomy</text><text x="162" y="190" font-size="24" fill="#17384a" text-anchor="middle" font-weight="400">Available: Yes</text><text x="162" y="231" font-size="24" fill="#17384a" text-anchor="middle" font-weight="700">Both tests: No</text><rect x="345" y="76" width="266" height="177" rx="12" fill="#e4f2ee" stroke="#2b8187" stroke-width="2"/><text x="478" y="112" font-size="28" fill="#17384a" text-anchor="middle" font-weight="700">B3</text><text x="478" y="153" font-size="25" fill="#17384a" text-anchor="middle" font-weight="400">Gardening</text><text x="478" y="190" font-size="24" fill="#17384a" text-anchor="middle" font-weight="400">Available: No</text><text x="478" y="231" font-size="24" fill="#17384a" text-anchor="middle" font-weight="700">Both tests: No</text><text x="320" y="296" font-size="24" fill="#17384a" text-anchor="middle" font-weight="400">Each property occurs somewhere.</text><text x="320" y="329" font-size="26" fill="#17384a" text-anchor="middle" font-weight="700">No row has both.</text></g></svg>
