h="2"/><rect x="488" y="143" width="37" height="37" rx="0" fill="#e4f2ee" stroke="#17384a" stroke-width="2"/><rect x="525" y="143" width="37" height="37" rx="0" fill="#efbb4d" stroke="#17384a" stroke-width="2"/><rect x="414" y="180" width="37" height="37" rx="0" fill="#e4f2ee" stroke="#17384a" stroke-width="2"/><rect x="451" y="180" width="37" height="37" rx="0" fill="#e4f2ee" stroke="#17384a" stroke-width="2"/><rect x="488" y="180" width="37" height="37" rx="0" fill="#e4f2ee" stroke="#17384a" stroke-width="2"/><rect x="525" y="180" width="37" height="37" rx="0" fill="#efbb4d" stroke="#17384a" stroke-width="2"/><rect x="414" y="217" width="37" height="37" rx="0" fill="#efbb4d" stroke="#17384a" stroke-width="2"/><rect x="451" y="217" width="37" height="37" rx="0" fill="#efbb4d" stroke="#17384a" stroke-width="2"/><rect x="488" y="217" width="37" height="37" rx="0" fill="#efbb4d" stroke="#17384a" stroke-width="2"/><rect x="525" y="217" width="37" height="37" rx="0" fill="#efbb4d" stroke="#17384a" stroke-width="2"/><text x="488.0" y="85" font-size="27" fill="#17384a" text-anchor="middle" font-weight="700">4 × 4</text><text x="488.0" y="295" font-size="26" fill="#17384a" text-anchor="middle" font-weight="700">16 tiles</text><path d="M224,171 L380,171" fill="none" stroke="#17384a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="303" y="142" font-size="26" fill="#17384a" text-anchor="middle" font-weight="700">Add 7</text><text x="303" y="211" font-size="25" fill="#17384a" text-anchor="middle" font-weight="400">4 + 3</text><text x="320" y="334" font-size="23" fill="#17384a" text-anchor="middle" font-weight="400">New tiles: a row of 4 and a column of 3.</text></g></svg>
