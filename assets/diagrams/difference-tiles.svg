<svg xmlns="http://www.w3.org/2000/svg" width="640" height="355" viewBox="0 0 640 355" role="img" aria-labelledby="title desc">
<title id="title">Grow the square by one step</title><desc id="desc">A three-by-three square has nine old tiles. Extending it to four by four adds a row of four and a column of three, for seven new tiles and sixteen total.</desc>
