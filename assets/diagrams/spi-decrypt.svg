<svg xmlns="http://www.w3.org/2000/svg" width="640" height="356" viewBox="0 0 640 356" role="img" aria-labelledby="title desc">
<title id="title">Receiving is not yet reading</title><desc id="desc">The same ciphertext C is tested with two keys. Decryption with the matching key K recovers print one poster and continues. A different key J does not enable that decryption step.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#17384a" stroke-width="2"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><rect x="1" y="1" width="638" height="354" rx="22" fill="#fffdf7" stroke="#d9e1dc" stroke-width="2"/><text x="26" y="40" font-size="27" fill="#17384a" text-anchor="start" font-weight="700">Receiving is not yet reading</text><text x="320" y="81" font-size="24" fill="#17384a" text-anchor="middle" font-weight="400">C was encrypted with K</text><rect x="34.0" y="116" width="74" height="52" rx="14" fill="#efbb4d" stroke="none" stroke-width="0"/><text x="71" y="151" font-size="23" fill="#17384a" text-anchor="middle" font-weight="600">C</text><path d="M120,141 L183,141" fill="none" stroke="#17384a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="199.0" y="116" width="158" height="52" rx="14" fill="#e4f2ee" stroke="none" stroke-width="0"/><text x="278" y="151" font-size="23" fill="#17384a" text-anchor="middle" font-weight="600">Try key K</text><path d="M371,141 L414,141" fill="none" stroke="#17384a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="428" y="105" width="187" height="79" rx="12" fill="#e4f2ee" stroke="#17384a" stroke-width="2"/><text x="522" y="136" font-size="23" fill="#17384a" text-anchor="middle" font-weight="600">Read:</text><text x="522" y="164" font-size="23" fill="#17384a" text-anchor="middle" font-weight="600">print 1 poster</text><rect x="34.0" y="228" width="74" height="52" rx="14" fill="#efbb4d" stroke="none" stroke-width="0"/><text x="71" y="263" font-size="23" fill="#17384a" text-anchor="middle" font-weight="600">C</text><path d="M120,253 L183,253" fill="none" stroke="#17384a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="199.0" y="228" width="158" height="52" rx="14" fill="#e4f2ee" stroke="none" stroke-width="0"/><text x="278" y="263" font-size="23" fill="#17384a" text-anchor="middle" font-weight="600">Try key J</text><path d="M371,253 L414,253" fill="none" stroke="#17384a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="428" y="217" width="187" height="79" rx="12" fill="#fbe6de" stroke="#17384a" stroke-width="2"/><text x="522" y="248" font-size="23" fill="#17384a" text-anchor="middle" font-weight="600">No decryption</text><text x="522" y="276" font-size="23" fill="#17384a" text-anchor="middle" font-weight="600">step</text><text x="320" y="334" font-size="23" fill="#17384a" text-anchor="middle" font-weight="400">Only the matching key enables this rule.</text></g></svg>
