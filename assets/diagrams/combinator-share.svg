<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" role="img" aria-labelledby="title desc">
<title id="title">S supplies the same input twice</title><desc id="desc">S K K tea rewrites to two copies of the expression K tea, with the left applied to the right. K keeps tea and discards the right expression, leaving tea.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#17384a" stroke-width="2"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><rect x="1" y="1" width="638" height="418" rx="22" fill="#fffdf7" stroke="#d9e1dc" stroke-width="2"/><text x="26" y="40" font-size="27" fill="#17384a" text-anchor="start" font-weight="700">S supplies the same input twice</text><rect x="205.0" y="69" width="230" height="52" rx="14" fill="#e4f2ee" stroke="none" stroke-width="0"/><text x="320" y="104" font-size="23" fill="#17384a" text-anchor="middle" font-weight="600">S K K tea</text><path d="M280,128 L166,174" fill="none" stroke="#17384a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M360,128 L474,174" fill="none" stroke="#17384a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="81.0" y="179" width="150" height="52" rx="14" fill="#e4f2ee" stroke="none" stroke-width="0"/><text x="156" y="214" font-size="23" fill="#17384a" text-anchor="middle" font-weight="600">K tea</text><rect x="409.0" y="179" width="150" height="52" rx="14" fill="#e4f2ee" stroke="none" stroke-width="0"/><text x="484" y="214" font-size="23" fill="#17384a" text-anchor="middle" font-weight="600">K tea</text><text x="156" y="257" font-size="23" fill="#17384a" text-anchor="middle" font-weight="400">Instruction</text><text x="484" y="257" font-size="23" fill="#17384a" text-anchor="middle" font-weight="400">Its next input</text><path d="M240,203 L399,203" fill="none" stroke="#17384a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="320" y="187" font-size="21" fill="#17384a" text-anchor="middle" font-weight="400">apply to</text><path d="M320,216 L320,329" fill="none" stroke="#17384a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="129" y="278" width="382" height="38" rx="0" fill="#fffdf7" stroke="none" stroke-width="0"/><text x="320" y="304" font-size="22" fill="#17384a" text-anchor="middle" font-weight="400">K keeps tea; drops the other term</text><rect x="245.0" y="341" width="150" height="52" rx="14" fill="#efbb4d" stroke="none" stroke-width="0"/><text x="320" y="376" font-size="23" fill="#17384a" text-anchor="middle" font-weight="600">tea</text></g></svg>
