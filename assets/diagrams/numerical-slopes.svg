<svg xmlns="http://www.w3.org/2000/svg" width="640" height="375" viewBox="0 0 640 375" role="img" aria-labelledby="title desc">
<title id="title">Three samples, three rate estimates</title><desc id="desc">Tank readings are six liters at minute one, nine at minute two, and fourteen at minute three. Backward and forward one-minute changes give rates three and five; the two-minute centered comparison gives four liters per minute.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#17384a" stroke-width="2"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><rect x="1" y="1" width="638" height="373" rx="22" fill="#fffdf7" stroke="#d9e1dc" stroke-width="2"/><text x="26" y="40" font-size="27" fill="#17384a" text-anchor="start" font-weight="700">Three samples, three rate estimates</text><text x="90" y="89" font-size="23" fill="#17384a" text-anchor="middle" font-weight="400">Minute 1</text><circle cx="90" cy="133" r="30" fill="#e4f2ee" stroke="#17384a" stroke-width="3"/><text x="90" y="142" font-size="27" fill="#17384a" text-anchor="middle" font-weight="700">6</text><text x="90" y="184" font-size="23" fill="#17384a" text-anchor="middle" font-weight="400">liters</text><text x="320" y="89" font-size="23" fill="#17384a" text-anchor="middle" font-weight="400">Minute 2</text><circle cx="320" cy="133" r="30" fill="#e4f2ee" stroke="#17384a" stroke-width="3"/><text x="320" y="142" font-size="27" fill="#17384a" text-anchor="middle" font-weight="700">9</text><text x="320" y="184" font-size="23" fill="#17384a" text-anchor="middle" font-weight="400">liters</text><text x="550" y="89" font-size="23" fill="#17384a" text-anchor="middle" font-weight="400">Minute 3</text><circle cx="550" cy="133" r="30" fill="#e4f2ee" stroke="#17384a" stroke-width="3"/><text x="550" y="142" font-size="27" fill="#17384a" text-anchor="middle" font-weight="700">14</text><text x="550" y="184" font-size="23" fill="#17384a" text-anchor="middle" font-weight="400">liters</text><path d="M132,128 L276,128" fill="none" stroke="#17384a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="204" y="113" font-size="23" fill="#17384a" text-anchor="middle" font-weight="700">+3 L</text><text x="204" y="164" font-size="20" fill="#17384a" text-anchor="middle" font-weight="400">in 1 min</text><path d="M362,128 L506,128" fill="none" stroke="#17384a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="434" y="113" font-size="23" fill="#17384a" text-anchor="middle" font-weight="700">+5 L</text><text x="434" y="164" font-size="20" fill="#17384a" text-anchor="middle" font-weight="400">in 1 min</text><rect x="29" y="209" width="582" height="57" rx="12" fill="#e4f2ee" stroke="none" stroke-width="0"/><text x="320" y="245" font-size="24" fill="#17384a" text-anchor="middle" font-weight="400">Backward: 3 L/min · Forward: 5 L/min</text><path d="M90,299 L550,299" fill="none" stroke="#17384a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="199" y="281" width="242" height="36" rx="0" fill="#fffdf7" stroke="none" stroke-width="0"/><text x="320" y="306" font-size="24" fill="#17384a" text-anchor="middle" font-weight="400">+8 L in 2 minutes</text><text x="320" y="350" font-size="25" fill="#17384a" text-anchor="middle" font-weight="700">Centered: 8 ÷ 2 = 4 L/min</text></g></svg>
