<svg xmlns="http://www.w3.org/2000/svg" width="640" height="335" viewBox="0 0 640 335" role="img" aria-labelledby="title desc">
<title id="title">Same record, different originals</title><desc id="desc">The pairs zero and two, and one and one, both average to one. Repeating that average rebuilds one and one; the record alone cannot identify which original pair was used.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#17384a" stroke-width="2"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><rect x="1" y="1" width="638" height="333" rx="22" fill="#fffdf7" stroke="#d9e1dc" stroke-width="2"/><text x="26" y="40" font-size="27" fill="#17384a" text-anchor="start" font-weight="700">Same record, different originals</text><circle cx="64" cy="117" r="24" fill="#e4f2ee" stroke="#17384a" stroke-width="3"/><text x="64" y="126" font-size="27" fill="#17384a" text-anchor="middle" font-weight="700">0</text><circle cx="135" cy="117" r="24" fill="#e4f2ee" stroke="#17384a" stroke-width="3"/><text x="135" y="126" font-size="27" fill="#17384a" text-anchor="middle" font-weight="700">2</text><path d="M170,117 L293,184" fill="none" stroke="#17384a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><circle cx="64" cy="251" r="24" fill="#e4f2ee" stroke="#17384a" stroke-width="3"/><text x="64" y="260" font-size="27" fill="#17384a" text-anchor="middle" font-weight="700">1</text><circle cx="135" cy="251" r="24" fill="#e4f2ee" stroke="#17384a" stroke-width="3"/><text x="135" y="260" font-size="27" fill="#17384a" text-anchor="middle" font-weight="700">1</text><path d="M170,251 L293,184" fill="none" stroke="#17384a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><circle cx="325" cy="184" r="32" fill="#efbb4d" stroke="#17384a" stroke-width="3"/><text x="325" y="193" font-size="27" fill="#17384a" text-anchor="middle" font-weight="700">1</text><text x="325" y="119" font-size="24" fill="#17384a" text-anchor="middle" font-weight="400">average</text><path d="M368,184 L465,184" fill="none" stroke="#17384a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="490" y="87" font-size="22" fill="#17384a" text-anchor="middle" font-weight="400">repeat average</text><circle cx="501" cy="184" r="24" fill="#e4f2ee" stroke="#17384a" stroke-width="3"/><text x="501" y="193" font-size="27" fill="#17384a" text-anchor="middle" font-weight="700">1</text><circle cx="575" cy="184" r="24" fill="#e4f2ee" stroke="#17384a" stroke-width="3"/><text x="575" y="193" font-size="27" fill="#17384a" text-anchor="middle" font-weight="700">1</text><text x="100" y="74" font-size="22" fill="#17384a" text-anchor="middle" font-weight="400">original pairs</text><text x="528" y="248" font-size="23" fill="#17384a" text-anchor="middle" font-weight="400">rebuilt pair</text><text x="320" y="312" font-size="23" fill="#17384a" text-anchor="middle" font-weight="400">The record does not reveal which original.</text></g></svg>
