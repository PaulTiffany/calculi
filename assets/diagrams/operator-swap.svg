<svg xmlns="http://www.w3.org/2000/svg" width="640" height="290" viewBox="0 0 640 290" role="img" aria-labelledby="title desc">
<title id="title">What does the action do twice?</title><desc id="desc">The swap operator A sends the pair two, five to five, two. A second application returns two, five. Two swaps act as the identity on every pair.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#17384a" stroke-width="2"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><rect x="1" y="1" width="638" height="288" rx="22" fill="#fffdf7" stroke="#d9e1dc" stroke-width="2"/><text x="26" y="40" font-size="27" fill="#17384a" text-anchor="start" font-weight="700">What does the action do twice?</text><text x="91" y="89" font-size="24" fill="#17384a" text-anchor="middle" font-weight="700">Start</text><circle cx="57" cy="164" r="25" fill="#e4f2ee" stroke="#17384a" stroke-width="3"/><text x="57" y="173" font-size="27" fill="#17384a" text-anchor="middle" font-weight="700">2</text><circle cx="125" cy="164" r="25" fill="#efbb4d" stroke="#17384a" stroke-width="3"/><text x="125" y="173" font-size="27" fill="#17384a" text-anchor="middle" font-weight="700">5</text><text x="319" y="89" font-size="24" fill="#17384a" text-anchor="middle" font-weight="700">One swap</text><circle cx="285" cy="164" r="25" fill="#efbb4d" stroke="#17384a" stroke-width="3"/><text x="285" y="173" font-size="27" fill="#17384a" text-anchor="middle" font-weight="700">5</text><circle cx="353" cy="164" r="25" fill="#e4f2ee" stroke="#17384a" stroke-width="3"/><text x="353" y="173" font-size="27" fill="#17384a" text-anchor="middle" font-weight="700">2</text><text x="547" y="89" font-size="24" fill="#17384a" text-anchor="middle" font-weight="700">Two swaps</text><circle cx="513" cy="164" r="25" fill="#e4f2ee" stroke="#17384a" stroke-width="3"/><text x="513" y="173" font-size="27" fill="#17384a" text-anchor="middle" font-weight="700">2</text><circle cx="581" cy="164" r="25" fill="#efbb4d" stroke="#17384a" stroke-width="3"/><text x="581" y="173" font-size="27" fill="#17384a" text-anchor="middle" font-weight="700">5</text><path d="M160,164 L252,164" fill="none" stroke="#17384a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="206" y="144" font-size="25" fill="#17384a" text-anchor="middle" font-weight="400">A</text><path d="M388,164 L480,164" fill="none" stroke="#17384a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="434" y="144" font-size="25" fill="#17384a" text-anchor="middle" font-weight="400">A</text><text x="320" y="256" font-size="23" fill="#17384a" text-anchor="middle" font-weight="400">A² = I: two swaps leave the input unchanged.</text></g></svg>
