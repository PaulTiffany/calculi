<svg xmlns="http://www.w3.org/2000/svg" width="640" height="402" viewBox="0 0 640 402" role="img" aria-labelledby="title desc">
<title id="title">Connect records through a shared value</title><desc id="desc">A request has reader Jo and topic Gardening. A book has ID B1, title Small Gardens, topic Gardening, and availability Yes. The same topic value fills the topic slot in both records; the output keeps Jo and B1.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#17384a" stroke-width="2"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><rect x="1" y="1" width="638" height="400" rx="22" fill="#fffdf7" stroke="#d9e1dc" stroke-width="2"/><text x="26" y="40" font-size="27" fill="#17384a" text-anchor="start" font-weight="700">Connect records through a shared value</text><text x="31" y="84" font-size="24" fill="#17384a" text-anchor="start" font-weight="700">Request</text><text x="192" y="85" font-size="22" fill="#17384a" text-anchor="middle" font-weight="400">Reader</text><rect x="138.5" y="99" width="107" height="52" rx="14" fill="#e4f2ee" stroke="none" stroke-width="0"/><text x="192" y="134" font-size="23" fill="#17384a" text-anchor="middle" font-weight="600">Jo</text><text x="449" y="85" font-size="22" fill="#17384a" text-anchor="middle" font-weight="400">Topic</text><rect x="357.5" y="99" width="183" height="52" rx="14" fill="#e4f2ee" stroke="none" stroke-width="0"/><text x="449" y="134" font-size="23" fill="#17384a" text-anchor="middle" font-weight="600">Gardening</text><path d="M449,158 L449,197" fill="none" stroke="#17384a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="462" y="186" font-size="21" fill="#17384a" text-anchor="start" font-weight="400">same value</text><text x="31" y="204" font-size="24" fill="#17384a" text-anchor="start" font-weight="700">Book</text><text x="81" y="240" font-size="21" fill="#17384a" text-anchor="middle" font-weight="400">ID</text><rect x="40.0" y="254" width="82" height="52" rx="14" fill="#e4f2ee" stroke="none" stroke-width="0"/><text x="81" y="289" font-size="23" fill="#17384a" text-anchor="middle" font-weight="600">B1</text><text x="248" y="240" font-size="21" fill="#17384a" text-anchor="middle" font-weight="400">Title</text><rect x="137.0" y="254" width="222" height="52" rx="14" fill="#e4f2ee" stroke="none" stroke-width="0"/><text x="248" y="289" font-size="23" fill="#17384a" text-anchor="middle" font-weight="600">Small Gardens</text><text x="449" y="240" font-size="21" fill="#17384a" text-anchor="middle" font-weight="400">Topic</text><rect x="371.5" y="254" width="155" height="52" rx="14" fill="#e4f2ee" stroke="none" stroke-width="0"/><text x="449" y="289" font-size="23" fill="#17384a" text-anchor="middle" font-weight="600">Gardening</text><text x="578" y="240" font-size="21" fill="#17384a" text-anchor="middle" font-weight="400">Available</text><rect x="542.0" y="254" width="72" height="52" rx="14" fill="#e4f2ee" stroke="none" stroke-width="0"/><text x="578" y="289" font-size="23" fill="#17384a" text-anchor="middle" font-weight="600">Yes</text><rect x="66" y="333" width="508" height="47" rx="12" fill="#efbb4d" stroke="none" stroke-width="0"/><text x="320" y="364" font-size="25" fill="#17384a" text-anchor="middle" font-weight="700">Keep reader and ID: (Jo, B1)</text></g></svg>
