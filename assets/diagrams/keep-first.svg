<svg xmlns="http://www.w3.org/2000/svg" width="640" height="270" viewBox="0 0 640 270" role="img" aria-labelledby="title desc">
<title id="title">Use the first input</title><desc id="desc">The inputs are red first and blue second. The rule returns red. Changing the selected input position changes the result.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#17384a" stroke-width="2"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><rect x="1" y="1" width="638" height="268" rx="22" fill="#fffdf7" stroke="#d9e1dc" stroke-width="2"/><text x="26" y="40" font-size="27" fill="#17384a" text-anchor="start" font-weight="700">Use the first input</text><circle cx="74" cy="105" r="23" fill="#b74d32" stroke="#17384a" stroke-width="3"/><text x="74" y="114" font-size="27" fill="#fffdf7" text-anchor="middle" font-weight="700"></text><text x="112" y="113" font-size="23" fill="#17384a" text-anchor="start" font-weight="400">1st: red</text><path d="M221,105 L259,150" fill="none" stroke="#17384a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><circle cx="74" cy="195" r="23" fill="#8bcce5" stroke="#17384a" stroke-width="3"/><text x="74" y="204" font-size="27" fill="#17384a" text-anchor="middle" font-weight="700"></text><text x="112" y="203" font-size="23" fill="#17384a" text-anchor="start" font-weight="400">2nd: blue</text><path d="M221,195 L259,150" fill="none" stroke="#17384a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="269" y="105" width="166" height="93" rx="18" fill="#e4f2ee" stroke="#2b8187" stroke-width="3"/><text x="352" y="143" font-size="26" fill="#17384a" text-anchor="middle" font-weight="400">keep</text><text x="352" y="177" font-size="26" fill="#17384a" text-anchor="middle" font-weight="700">first</text><path d="M444,150 L493,150" fill="none" stroke="#17384a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><circle cx="554" cy="150" r="25" fill="#b74d32" stroke="#17384a" stroke-width="3"/><text x="554" y="159" font-size="27" fill="#fffdf7" text-anchor="middle" font-weight="700"></text><text x="554" y="215" font-size="26" fill="#17384a" text-anchor="middle" font-weight="700">red</text></g></svg>
