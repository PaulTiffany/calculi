<svg xmlns="http://www.w3.org/2000/svg" width="640" height="422" viewBox="0 0 640 422" role="img" aria-labelledby="title desc">
<title id="title">Solve in a different form</title><desc id="desc">The time equation and starting value are transformed into an algebra equation. Solving gives the transformed answer; the inverse transform returns the amount as a function of time. The starting four liters is included in the first step.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#17384a" stroke-width="2"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><rect x="1" y="1" width="638" height="420" rx="22" fill="#fffdf7" stroke="#d9e1dc" stroke-width="2"/><text x="26" y="40" font-size="27" fill="#17384a" text-anchor="start" font-weight="700">Solve in a different form</text><rect x="29" y="80" width="250" height="107" rx="12" fill="#e4f2ee" stroke="#2b8187" stroke-width="2"/><text x="154" y="108" font-size="24" fill="#17384a" text-anchor="middle" font-weight="700">Time problem</text><text x="154" y="142" font-size="22" fill="#17384a" text-anchor="middle" font-weight="400">Rate = 6 − amount/2</text><text x="154" y="171" font-size="22" fill="#17384a" text-anchor="middle" font-weight="400">Start = 4 liters</text><rect x="361" y="80" width="250" height="107" rx="12" fill="#e4f2ee" stroke="#2b8187" stroke-width="2"/><text x="486" y="108" font-size="24" fill="#17384a" text-anchor="middle" font-weight="700">Algebra problem</text><text x="486" y="142" font-size="22" fill="#17384a" text-anchor="middle" font-weight="400">Transform the rate</text><text x="486" y="171" font-size="22" fill="#17384a" text-anchor="middle" font-weight="400">and carry the start</text><rect x="361" y="294" width="250" height="107" rx="12" fill="#e4f2ee" stroke="#2b8187" stroke-width="2"/><text x="486" y="322" font-size="24" fill="#17384a" text-anchor="middle" font-weight="700">Algebra answer</text><text x="486" y="356" font-size="22" fill="#17384a" text-anchor="middle" font-weight="400">Solve for the</text><text x="486" y="385" font-size="22" fill="#17384a" text-anchor="middle" font-weight="400">transformed function</text><rect x="29" y="294" width="250" height="107" rx="12" fill="#e4f2ee" stroke="#2b8187" stroke-width="2"/><text x="154" y="322" font-size="24" fill="#17384a" text-anchor="middle" font-weight="700">Time answer</text><text x="154" y="356" font-size="22" fill="#17384a" text-anchor="middle" font-weight="400">12 minus a</text><text x="154" y="385" font-size="22" fill="#17384a" text-anchor="middle" font-weight="400">shrinking gap of 8</text><path d="M288,134 L352,134" fill="none" stroke="#17384a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M486,197 L486,284" fill="none" stroke="#17384a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M352,348 L288,348" fill="none" stroke="#17384a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="319" y="118" font-size="25" fill="#17384a" text-anchor="middle" font-weight="700">L</text><text x="502" y="246" font-size="22" fill="#17384a" text-anchor="start" font-weight="400">Solve</text><text x="319" y="332" font-size="25" fill="#17384a" text-anchor="middle" font-weight="700">L⁻¹</text><text x="41" y="226" font-size="22" fill="#17384a" text-anchor="start" font-weight="400">L: Laplace transform</text><text x="41" y="257" font-size="22" fill="#17384a" text-anchor="start" font-weight="400">L⁻¹: transform back</text></g></svg>
