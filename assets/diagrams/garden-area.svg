<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320" role="img" aria-labelledby="title desc">
<title id="title">Same fence, different area</title><desc id="desc">A three-by-five rectangle encloses fifteen square meters. A four-by-four square encloses sixteen. Both use sixteen meters of fence.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#17384a" stroke-width="2"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><rect x="1" y="1" width="638" height="318" rx="22" fill="#fffdf7" stroke="#d9e1dc" stroke-width="2"/><text x="26" y="40" font-size="27" fill="#17384a" text-anchor="start" font-weight="700">Same fence, different area</text><rect x="90" y="104" width="130" height="78" rx="0" fill="#e4f2ee" stroke="#2b8187" stroke-width="4"/><path d="M116,104 L116,182" fill="none" stroke="#85b2a9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M142,104 L142,182" fill="none" stroke="#85b2a9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M168,104 L168,182" fill="none" stroke="#85b2a9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M194,104 L194,182" fill="none" stroke="#85b2a9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M90,130 L220,130" fill="none" stroke="#85b2a9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M90,156 L220,156" fill="none" stroke="#85b2a9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="155" y="79" font-size="25" fill="#17384a" text-anchor="middle" font-weight="700">3 m × 5 m</text><text x="155" y="244" font-size="23" fill="#17384a" text-anchor="middle" font-weight="400">15 square meters</text><rect x="421" y="104" width="104" height="104" rx="0" fill="#e4f2ee" stroke="#2b8187" stroke-width="4"/><path d="M447,104 L447,208" fill="none" stroke="#85b2a9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M473,104 L473,208" fill="none" stroke="#85b2a9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M499,104 L499,208" fill="none" stroke="#85b2a9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M421,130 L525,130" fill="none" stroke="#85b2a9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M421,156 L525,156" fill="none" stroke="#85b2a9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M421,182 L525,182" fill="none" stroke="#85b2a9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="473" y="79" font-size="25" fill="#17384a" text-anchor="middle" font-weight="700">4 m × 4 m</text><text x="473" y="244" font-size="23" fill="#17384a" text-anchor="middle" font-weight="400">16 square meters</text><text x="320" y="289" font-size="23" fill="#17384a" text-anchor="middle" font-weight="400">Each small square is 1 square meter.</text></g></svg>
