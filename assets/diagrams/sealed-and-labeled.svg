<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320" role="img" aria-labelledby="title desc">
<title id="title">If sealed, then labeled</title><desc id="desc">Both a sealed labeled jar and an open labeled jar obey the one-way rule. Seeing a label alone therefore does not establish that a jar is sealed.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#17384a" stroke-width="2"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><rect x="1" y="1" width="638" height="318" rx="22" fill="#fffdf7" stroke="#d9e1dc" stroke-width="2"/><text x="26" y="40" font-size="27" fill="#17384a" text-anchor="start" font-weight="700">If sealed, then labeled</text><rect x="100" y="117" width="96" height="126" rx="17" fill="#e4f2ee" stroke="#17384a" stroke-width="3"/><rect x="116" y="171" width="64" height="38" rx="4" fill="#fffdf7" stroke="#17384a" stroke-width="2"/><text x="148" y="198" font-size="20" fill="#17384a" text-anchor="middle" font-weight="400">label</text><rect x="97" y="107" width="102" height="19" rx="5" fill="#efbb4d" stroke="#17384a" stroke-width="2"/><text x="148" y="278" font-size="25" fill="#17384a" text-anchor="middle" font-weight="700">sealed</text><rect x="447" y="117" width="96" height="126" rx="17" fill="#e4f2ee" stroke="#17384a" stroke-width="3"/><rect x="463" y="171" width="64" height="38" rx="4" fill="#fffdf7" stroke="#17384a" stroke-width="2"/><text x="495" y="198" font-size="20" fill="#17384a" text-anchor="middle" font-weight="400">label</text><rect x="528" y="94" width="85" height="18" rx="5" fill="#efbb4d" stroke="#17384a" stroke-width="2"/><text x="495" y="278" font-size="25" fill="#17384a" text-anchor="middle" font-weight="700">open</text><text x="148" y="84" font-size="24" fill="#17384a" text-anchor="middle" font-weight="400">Allowed</text><text x="494" y="84" font-size="24" fill="#17384a" text-anchor="middle" font-weight="400">Also allowed</text></g></svg>
