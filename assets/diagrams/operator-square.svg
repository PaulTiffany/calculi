<svg xmlns="http://www.w3.org/2000/svg" width="640" height="430" viewBox="0 0 640 430" role="img" aria-labelledby="title desc">
<title id="title">Two different meanings of “square”</title><desc id="desc">Matrix multiplication squares the swap matrix to give the identity matrix. Squaring each entry separately leaves the swap matrix unchanged.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#17384a" stroke-width="2"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><rect x="1" y="1" width="638" height="428" rx="22" fill="#fffdf7" stroke="#d9e1dc" stroke-width="2"/><text x="26" y="40" font-size="27" fill="#17384a" text-anchor="start" font-weight="700">Two different meanings of “square”</text><path d="M280,75 H270 V159 H280" fill="none" stroke="#17384a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M370,75 H380 V159 H370" fill="none" stroke="#17384a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="302" y="106" font-size="28" fill="#17384a" text-anchor="middle" font-weight="700">0</text><text x="348" y="106" font-size="28" fill="#17384a" text-anchor="middle" font-weight="700">1</text><text x="302" y="149" font-size="28" fill="#17384a" text-anchor="middle" font-weight="700">1</text><text x="348" y="149" font-size="28" fill="#17384a" text-anchor="middle" font-weight="700">0</text><text x="240" y="124" font-size="25" fill="#17384a" text-anchor="middle" font-weight="400">A =</text><path d="M304,173 L183,215" fill="none" stroke="#17384a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M351,173 L472,215" fill="none" stroke="#17384a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="169" y="246" font-size="23" fill="#17384a" text-anchor="middle" font-weight="700">Compose A with A</text><text x="477" y="246" font-size="23" fill="#17384a" text-anchor="middle" font-weight="700">Square each entry</text><path d="M124,266 H114 V350 H124" fill="none" stroke="#17384a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M214,266 H224 V350 H214" fill="none" stroke="#17384a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="146" y="297" font-size="28" fill="#17384a" text-anchor="middle" font-weight="700">1</text><text x="192" y="297" font-size="28" fill="#17384a" text-anchor="middle" font-weight="700">0</text><text x="146" y="340" font-size="28" fill="#17384a" text-anchor="middle" font-weight="700">0</text><text x="192" y="340" font-size="28" fill="#17384a" text-anchor="middle" font-weight="700">1</text><path d="M432,266 H422 V350 H432" fill="none" stroke="#17384a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M522,266 H532 V350 H522" fill="none" stroke="#17384a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="454" y="297" font-size="28" fill="#17384a" text-anchor="middle" font-weight="700">0</text><text x="500" y="297" font-size="28" fill="#17384a" text-anchor="middle" font-weight="700">1</text><text x="454" y="340" font-size="28" fill="#17384a" text-anchor="middle" font-weight="700">1</text><text x="500" y="340" font-size="28" fill="#17384a" text-anchor="middle" font-weight="700">0</text><text x="169" y="382" font-size="24" fill="#17384a" text-anchor="middle" font-weight="400">No swap</text><text x="477" y="382" font-size="24" fill="#17384a" text-anchor="middle" font-weight="400">One swap</text></g></svg>
