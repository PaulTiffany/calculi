333" r="26" fill="#efbb4d" stroke="#17384a" stroke-width="3"/><text x="469" y="342" font-size="27" fill="#17384a" text-anchor="middle" font-weight="700">2</text><text x="26" y="110" font-size="22" fill="#17384a" text-anchor="start" font-weight="600">Total</text><text x="26" y="212" font-size="22" fill="#17384a" text-anchor="start" font-weight="600">Next minus</text><text x="26" y="239" font-size="22" fill="#17384a" text-anchor="start" font-weight="600">current</text><text x="26" y="322" font-size="22" fill="#17384a" text-anchor="start" font-weight="600">Difference</text><text x="26" y="349" font-size="22" fill="#17384a" text-anchor="start" font-weight="600">of differences</text><text x="320" y="78" font-size="22" fill="#17384a" text-anchor="middle" font-weight="400">Side lengths: 0, 1, 2, 3, 4</text><text x="320" y="398" font-size="22" fill="#17384a" text-anchor="middle" font-weight="400">Each lower value is right minus left.</text></g></svg>
