<svg xmlns="http://www.w3.org/2000/svg" width="640" height="417" viewBox="0 0 640 417" role="img" aria-labelledby="title desc">
<title id="title">Take the differences again</title><desc id="desc">The values zero, one, four, nine, sixteen have first differences one, three, five, seven. Their second differences are two, two, two.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#17384a" stroke-width="2"/></marker></defs>
