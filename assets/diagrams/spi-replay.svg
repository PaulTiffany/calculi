<svg xmlns="http://www.w3.org/2000/svg" width="640" height="434" viewBox="0 0 640 434" role="img" aria-labelledby="title desc">
<title id="title">Copying a message can repeat an action</title><desc id="desc">A printer that remembers no earlier requests accepts ciphertext C twice and prints two posters. A printer that checks a matching one-use challenge accepts the first valid response, marks the challenge used, and rejects a repeated response, printing one poster.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#17384a" stroke-width="2"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><rect x="1" y="1" width="638" height="432" rx="22" fill="#fffdf7" stroke="#d9e1dc" stroke-width="2"/><text x="26" y="40" font-size="27" fill="#17384a" text-anchor="start" font-weight="700">Copying a message can repeat an action</text><text x="29" y="80" font-size="25" fill="#17384a" text-anchor="start" font-weight="700">Without a replay record</text><rect x="54.5" y="104" width="97" height="52" rx="14" fill="#efbb4d" stroke="none" stroke-width="0"/><text x="103" y="139" font-size="23" fill="#17384a" text-anchor="middle" font-weight="600">C</text><text x="103" y="189" font-size="24" fill="#17384a" text-anchor="middle" font-weight="700">Accept</text><rect x="289.5" y="104" width="97" height="52" rx="14" fill="#efbb4d" stroke="none" stroke-width="0"/><text x="338" y="139" font-size="23" fill="#17384a" text-anchor="middle" font-weight="600">C</text><text x="338" y="189" font-size="24" fill="#17384a" text-anchor="middle" font-weight="700">Accept</text><path d="M164,128 L271,128" fill="none" stroke="#17384a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="218" y="110" font-size="22" fill="#17384a" text-anchor="middle" font-weight="400">then</text><text x="527" y="136" font-size="34" fill="#17384a" text-anchor="middle" font-weight="700">2</text><text x="527" y="171" font-size="25" fill="#17384a" text-anchor="middle" font-weight="400">posters</text><text x="29" y="262" font-size="25" fill="#17384a" text-anchor="start" font-weight="700">With a one-use challenge</text><rect x="54.5" y="286" width="97" height="52" rx="14" fill="#efbb4d" stroke="none" stroke-width="0"/><text x="103" y="321" font-size="23" fill="#17384a" text-anchor="middle" font-weight="600">C</text><text x="103" y="371" font-size="24" fill="#17384a" text-anchor="middle" font-weight="700">Accept</text><rect x="289.5" y="286" width="97" height="52" rx="14" fill="#efbb4d" stroke="none" stroke-width="0"/><text x="338" y="321" font-size="23" fill="#17384a" text-anchor="middle" font-weight="600">C</text><text x="338" y="371" font-size="24" fill="#17384a" text-anchor="middle" font-weight="700">Reject</text><path d="M164,310 L271,310" fill="none" stroke="#17384a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="218" y="292" font-size="22" fill="#17384a" text-anchor="middle" font-weight="400">then</text><text x="527" y="318" font-size="34" fill="#17384a" text-anchor="middle" font-weight="700">1</text><text x="527" y="353" font-size="25" fill="#17384a" text-anchor="middle" font-weight="400">poster</text><text x="218" y="352" font-size="21" fill="#17384a" text-anchor="middle" font-weight="400">mark used</text><text x="320" y="414" font-size="22" fill="#17384a" text-anchor="middle" font-weight="400">The repeated response has the same challenge.</text></g></svg>
