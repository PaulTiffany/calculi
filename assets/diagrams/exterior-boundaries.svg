<svg xmlns="http://www.w3.org/2000/svg" width="640" height="340" viewBox="0 0 640 340" role="img" aria-labelledby="title desc">
<title id="title">Shared edges cancel</title><desc id="desc">Two adjacent unit squares are traced counterclockwise. The shared edge is traversed up and down. These opposite traversals cancel, leaving six outside unit edges.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#17384a" stroke-width="2"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><rect x="1" y="1" width="638" height="338" rx="22" fill="#fffdf7" stroke="#d9e1dc" stroke-width="2"/><text x="26" y="40" font-size="27" fill="#17384a" text-anchor="start" font-weight="700">Shared edges cancel</text><text x="147" y="88" font-size="25" fill="#17384a" text-anchor="middle" font-weight="700">Two loops</text><rect x="57" y="116" width="90" height="90" rx="0" fill="#e4f2ee" stroke="#a7b8b7" stroke-width="2"/><path d="M73,206 L129,206" fill="none" stroke="#2b8187" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M129,116 L73,116" fill="none" stroke="#2b8187" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="147" y="116" width="90" height="90" rx="0" fill="#fff1ce" stroke="#a7b8b7" stroke-width="2"/><path d="M163,206 L219,206" fill="none" stroke="#b74d32" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M219,116 L163,116" fill="none" stroke="#b74d32" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M57,132 L57,190" fill="none" stroke="#2b8187" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M237,190 L237,132" fill="none" stroke="#b74d32" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M141,190 L141,132" fill="none" stroke="#2b8187" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M153,132 L153,190" fill="none" stroke="#b74d32" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="94" y="170" font-size="27" fill="#17384a" text-anchor="middle" font-weight="400">A</text><text x="197" y="170" font-size="27" fill="#17384a" text-anchor="middle" font-weight="400">B</text><path d="M265,163 L363,163" fill="none" stroke="#17384a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="489" y="88" font-size="25" fill="#17384a" text-anchor="middle" font-weight="700">One boundary</text><rect x="391" y="113" width="196" height="98" rx="0" fill="#e4f2ee" stroke="#2b8187" stroke-width="3"/><path d="M411,211 L470,211" fill="none" stroke="#2b8187" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M509,211 L568,211" fill="none" stroke="#2b8187" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M568,113 L509,113" fill="none" stroke="#2b8187" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M470,113 L411,113" fill="none" stroke="#2b8187" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M391,128 L391,196" fill="none" stroke="#2b8187" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M587,196 L587,128" fill="none" stroke="#2b8187" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M489,111 L489,118" fill="none" stroke="#17384a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M489,206 L489,213" fill="none" stroke="#17384a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="147" y="253" font-size="21" fill="#17384a" text-anchor="middle" font-weight="400">Opposite shared steps</text><text x="489" y="253" font-size="24" fill="#17384a" text-anchor="middle" font-weight="400">6 unit edges</text><text x="320" y="310" font-size="25" fill="#17384a" text-anchor="middle" font-weight="400">Shared reading: +3 + (−3) = 0</text></g></svg>
