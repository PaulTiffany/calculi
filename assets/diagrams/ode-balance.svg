<svg xmlns="http://www.w3.org/2000/svg" width="640" height="354" viewBox="0 0 640 354" role="img" aria-labelledby="title desc">
<title id="title">Where does the amount stop changing?</title><desc id="desc">With inflow six liters per minute, amounts four, eight, twelve, and sixteen liters produce net rates plus four, plus two, zero, and minus two. Below twelve the amount rises; above twelve it falls.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#17384a" stroke-width="2"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><rect x="1" y="1" width="638" height="352" rx="22" fill="#fffdf7" stroke="#d9e1dc" stroke-width="2"/><text x="26" y="40" font-size="27" fill="#17384a" text-anchor="start" font-weight="700">Where does the amount stop changing?</text><text x="320" y="80" font-size="22" fill="#17384a" text-anchor="middle" font-weight="400">Inflow: 6 L/min · Outflow: half the amount / min</text><text x="87" y="122" font-size="25" fill="#17384a" text-anchor="middle" font-weight="700">4 liters</text><rect x="44" y="143" width="86" height="104" rx="5" fill="white" stroke="#17384a" stroke-width="2"/><rect x="48" y="220.2" width="78" height="22.8" rx="0" fill="#8bcce5" stroke="none" stroke-width="0"/><text x="87" y="282" font-size="24" fill="#17384a" text-anchor="middle" font-weight="700">+4 L/min</text><text x="87" y="321" font-size="23" fill="#17384a" text-anchor="middle" font-weight="400">Rises</text><text x="242" y="122" font-size="25" fill="#17384a" text-anchor="middle" font-weight="700">8 liters</text><rect x="199" y="143" width="86" height="104" rx="5" fill="white" stroke="#17384a" stroke-width="2"/><rect x="203" y="197.4" width="78" height="45.6" rx="0" fill="#8bcce5" stroke="none" stroke-width="0"/><text x="242" y="282" font-size="24" fill="#17384a" text-anchor="middle" font-weight="700">+2 L/min</text><text x="242" y="321" font-size="23" fill="#17384a" text-anchor="middle" font-weight="400">Rises</text><text x="397" y="122" font-size="25" fill="#17384a" text-anchor="middle" font-weight="700">12 liters</text><rect x="354" y="143" width="86" height="104" rx="5" fill="white" stroke="#17384a" stroke-width="2"/><rect x="358" y="174.6" width="78" height="68.4" rx="0" fill="#8bcce5" stroke="none" stroke-width="0"/><text x="397" y="282" font-size="24" fill="#17384a" text-anchor="middle" font-weight="700">0 L/min</text><text x="397" y="321" font-size="23" fill="#17384a" text-anchor="middle" font-weight="400">Steady</text><text x="552" y="122" font-size="25" fill="#17384a" text-anchor="middle" font-weight="700">16 liters</text><rect x="509" y="143" width="86" height="104" rx="5" fill="white" stroke="#17384a" stroke-width="2"/><rect x="513" y="151.8" width="78" height="91.2" rx="0" fill="#8bcce5" stroke="none" stroke-width="0"/><text x="552" y="282" font-size="24" fill="#17384a" text-anchor="middle" font-weight="700">−2 L/min</text><text x="552" y="321" font-size="23" fill="#17384a" text-anchor="middle" font-weight="400">Falls</text></g></svg>
